name: Apply smart work order PDF layout

on:
  push:
    paths:
      - '.github/workflows/apply-smart-work-order-pdf-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Apply controlled patch
        run: python3 .github/scripts/patch-smart-work-order-pdf.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit generated source change
        shell: bash
        run: |
          test -n "$(git status --porcelain src/utils/workOrderPdf.ts)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/workOrderPdf.ts
          git commit -m "Make work order PDF pagination space-aware"
          git push
