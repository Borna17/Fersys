name: Verify HR fiscal gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/services/fiscalizationGateway.service.ts'
      - 'supabase/functions/hr-fiscalization/**'
      - 'supabase/migrations/20260904_hr_fiscalization_gateway_audit_v1.sql'
      - '.github/workflows/verify-hr-fiscal-gateway.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
