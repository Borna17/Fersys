name: Apply customer notes and work-order customer collapse

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-customer-notes-workorder-collapse.yml'
      - 'scripts/apply-customer-notes-workorder-collapse.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source changes
        run: node scripts/apply-customer-notes-workorder-collapse.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit applied source
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/NewWorkOrderPage.tsx src/pages/CustomerProfilePage.tsx
          git commit -m "Improve work order customer details and investor notes"
          git push origin main
