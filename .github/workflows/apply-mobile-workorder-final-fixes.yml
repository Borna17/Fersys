name: Apply mobile work order final fixes

on:
  push:
    branches:
      - main
    paths:
      - scripts/patch-mobile-workorder-final-fixes.mjs

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/patch-mobile-workorder-final-fixes.mjs
      - run: npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/customerPhotos.service.ts src/pages/WorkOrderDetailsPage.tsx src/components/BusinessFlowActions.tsx
          git commit -m "fix: mobile work order gallery sharing and floating UI" || exit 0
          git push
