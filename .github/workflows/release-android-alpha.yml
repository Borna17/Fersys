name: Release Android Alpha

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/local-first-durability-engine
    paths:
      - '.github/release-android-alpha.trigger'

permissions:
  contents: read
  id-token: write

concurrency:
  group: fersys-android-alpha-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Android Alpha
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record release source
        shell: bash
        run: |
          set -euo pipefail
          echo "Release ref: $GITHUB_REF_NAME"
          echo "Release SHA: $GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify required secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_SERVICES_JSON_B64; do
            if [ -z "${!name:-}" ]; then echo "Missing required GitHub Actions secret: $name"; exit 1; fi
          done
      - name: Install dependencies
        run: npm ci
      - name: Run tests before native packaging
        run: npm test -- --run
      - name: Remove stale generated web assets
        run: rm -rf dist android/app/src/main/assets/public
      - name: Build fresh production web app
        run: npm run build
      - name: Verify current web source and fresh build
        shell: bash
        run: |
          set -euo pipefail
          test -s src/pages/SettingsPage.tsx
          grep -q "Postavke" src/pages/SettingsPage.tsx
          test -s dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
      - name: Restore Firebase Android config
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
          test -s android/app/google-services.json
      - name: Restore Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/fersys-upload-key.jks
          cat > android/keystore.properties <<EOF
          storeFile=fersys-upload-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Sync fresh web build into Capacitor Android
        run: npx cap sync android
      - name: Prove Android contains exact fresh web build
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/src/main/assets/public/index.html
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def manifest(root):
              root = Path(root)
              return {p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                      for p in sorted(root.rglob('*')) if p.is_file()}
          web = manifest('dist')
          native = manifest('android/app/src/main/assets/public')
          if web != native:
              missing = sorted(set(web) - set(native))
              extra = sorted(set(native) - set(web))
              changed = sorted(k for k in set(web) & set(native) if web[k] != native[k])
              raise SystemExit(f'STALE ANDROID ASSETS: missing={missing[:10]} extra={extra[:10]} changed={changed[:10]}')
          print(f'Android parity OK: {len(web)} files match dist byte-for-byte')
          PY
      - name: Read and verify Android version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' android/app/build.gradle | head -1)
          VERSION_NAME=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle | head -1)
          test -n "$VERSION_CODE" && test -n "$VERSION_NAME"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "FERSYS $VERSION_NAME ($VERSION_CODE), source $GITHUB_SHA"
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew
      - name: Build signed Android App Bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
      - name: Verify bundle exists
        run: test -s android/app/build/outputs/bundle/release/app-release.aab
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/9546007582/locations/global/workloadIdentityPools/fersys-github-actions/providers/github-fersys
          service_account: fersys-github-release@fersys-503622.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Publish to Google Play Alpha
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: com.fersys.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: alpha
          status: completed
          releaseName: FERSYS ${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }})
          changesNotSentForReview: false
