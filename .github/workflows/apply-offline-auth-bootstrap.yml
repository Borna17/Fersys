name: Apply offline auth bootstrap

on:
  push:
    branches:
      - fix/local-first-durability-engine
    paths:
      - '.github/workflows/apply-offline-auth-bootstrap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch AuthProvider for verified offline bootstrap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/auth/AuthProvider.tsx')
          s=p.read_text(encoding='utf-8-sig')
          anchor="const AUTH_REQUEST_TIMEOUT_MS = 10_000\n"
          insert="""const AUTH_REQUEST_TIMEOUT_MS = 10_000
const OFFLINE_AUTH_CACHE_KEY = 'fersys-offline-auth-v1'

type OfflineAuthCache = {
  session: Session
  membership: CurrentMembership
  cachedAt: string
}

function readOfflineAuthCache(): OfflineAuthCache | null {
  try {
    const raw = localStorage.getItem(OFFLINE_AUTH_CACHE_KEY)
    if (!raw) return null
    const parsed = JSON.parse(raw) as OfflineAuthCache
    if (!parsed?.session?.user?.id || !parsed?.membership?.companyId) return null
    if (parsed.membership.status !== 'active') return null
    return parsed
  } catch {
    return null
  }
}

function writeOfflineAuthCache(session: Session, membership: CurrentMembership | null) {
  if (!membership || membership.status !== 'active') return
  try {
    localStorage.setItem(OFFLINE_AUTH_CACHE_KEY, JSON.stringify({
      session,
      membership,
      cachedAt: new Date().toISOString(),
    } satisfies OfflineAuthCache))
  } catch {
    // Storage quota/private mode must never break online auth.
  }
}

function clearOfflineAuthCache() {
  try { localStorage.removeItem(OFFLINE_AUTH_CACHE_KEY) } catch { /* noop */ }
}
"""
