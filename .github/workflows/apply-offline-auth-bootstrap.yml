          s=s.replace(anchor,insert,1)

          old="""      } catch (error) {
        if (!isMounted) return

        setSession(null)
        setCompanySetupError(
          error instanceof Error
            ? error.message
            : 'Korisnička sesija nije se mogla učitati.',
        )
