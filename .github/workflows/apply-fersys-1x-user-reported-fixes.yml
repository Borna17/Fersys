name: Apply FERSYS 1.x user-reported fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-fersys-1x-user-reported-fixes.yml'
      - 'scripts/polish-fersys-1x-user-reported-fixes.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source changes
        run: node scripts/polish-fersys-1x-user-reported-fixes.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit applied source
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/customers.service.ts src/pages/DashboardPage.tsx src/components/BusinessFlowActions.tsx src/admin/AdminSupportPage.tsx src/utils/offerPdf.ts
          git commit -m "Polish FERSYS 1.x reported UX and refresh issues"
          git push origin main
