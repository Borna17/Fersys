name: Validate iOS release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-ios-release.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript and production build
        run: npm run build
      - name: Verify incompatible speech plugin is absent
        run: |
          if npm ls @capacitor-community/speech-recognition --depth=0 2>/dev/null; then
            echo "Unexpected speech-recognition dependency present"
            exit 1
          fi
          echo "speech-recognition dependency absent"
      - name: Verify Capacitor iOS dependency
        run: npm ls @capacitor/ios @capacitor/core --depth=0
      - name: Sync iOS web assets and plugins
        run: npx cap sync ios
