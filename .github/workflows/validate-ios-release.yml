name: Validate iOS release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-ios-release.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript and production build
        run: npm run build
      - name: Verify native-safe speech shim
        run: |
          npm ls @capacitor-community/speech-recognition --depth=0
          node -e "const p=require('./node_modules/@capacitor-community/speech-recognition/package.json'); if(p.version!=='8.0.0-fersys-shim') process.exit(1); console.log('native-safe speech shim OK')"
      - name: Verify Capacitor iOS dependency
        run: npm ls @capacitor/ios @capacitor/core --depth=0
      - name: Sync iOS web assets and plugins
        run: npx cap sync ios
