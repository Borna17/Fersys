name: Apply HR fiscal profile hardening

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/harden_hr_fiscal_profile.py'
      - '.github/workflows/apply-hr-fiscal-profile-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        run: python .github/scripts/harden_hr_fiscal_profile.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit verified changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/companyCompliance.service.ts \
                  src/components/settings/ModulesSettingsTab.tsx \
                  src/services/customers.service.ts
          git commit -m "Harden HR fiscal company profile"
          git pull --rebase origin main
          git push origin HEAD:main
