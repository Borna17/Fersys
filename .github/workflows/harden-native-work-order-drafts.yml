name: Harden native work order drafts

on:
  push:
    paths:
      - '.github/scripts/harden_native_work_order_drafts.py'
      - '.github/workflows/harden-native-work-order-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply native draft hardening
        run: python .github/scripts/harden_native_work_order_drafts.py

      - name: Verify safeguards
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/pages/NewWorkOrderPage.tsx').read_text(encoding='utf-8')
          required = [
              'fersys_emergency_new_work_order_v1',
              'customerSearch.trim()',
              'assignedWorkers.length',
              'localStorage.setItem(',
              'draftPayload',
              '}, 350)',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing native draft safeguards: {missing}')
          print('Native draft safeguards verified.')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit hardened source
        run: |
          if git diff --quiet -- src/pages/NewWorkOrderPage.tsx; then
            echo 'No draft source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/NewWorkOrderPage.tsx
          git commit -m 'Harden native unfinished work order autosave'
          git pull --rebase origin main
          git push origin main
