name: P0 Final Validation

on:
  push:
    branches:
      - fix/local-first-durability-engine
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preserve unsynced local draft during cloud conflict
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/services/drafts.service.ts')
          text = path.read_text()
          old = """  if (\n    cloud &&\n    (\n      !local ||\n      new Date(\n        cloud.updatedAt,\n      ).getTime() >\n        new Date(\n          local.updatedAt,\n        ).getTime()\n    )\n  ) {"""
          new = """  if (\n    cloud &&\n    (\n      !local ||\n      (\n        local.syncState !== 'pending' &&\n        new Date(\n          cloud.updatedAt,\n        ).getTime() >\n          new Date(\n            local.updatedAt,\n          ).getTime()\n      )\n    )\n  ) {"""
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('Expected draft conflict block was not found; refusing unsafe patch.')

      - name: Install dependencies
        run: npm ci

      - name: Auth durability tests
        run: npm run test:auth

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify P0 recovery wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f src/admin/AdminRecoveryPage.tsx
          grep -R "admin_get_recovery_snapshots_v1" -n src supabase
          grep -R "recovery_snapshots" -n src supabase
          grep -R "attachment" -n src/services src/pages | head -n 20
          grep -R "'/admin/recovery'\|\"/admin/recovery\"" -n src/admin src/router

      - name: Git whitespace check
        run: git diff --check HEAD^

      - name: Commit verified conflict recovery fix
        shell: bash
        run: |
          if git diff --quiet -- src/services/drafts.service.ts; then
            echo "Conflict recovery fix is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/drafts.service.ts
          git commit -m "Fix pending local draft conflict recovery"
          git push origin HEAD:fix/local-first-durability-engine
