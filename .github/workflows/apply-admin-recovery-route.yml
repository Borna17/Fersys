name: Apply Admin Recovery route

on:
  push:
    branches: [fix/local-first-durability-engine]
    paths: ['.github/workflows/apply-admin-recovery-route.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/local-first-durability-engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch router and admin navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          router = Path('src/router/AppRouter.tsx')
          s = router.read_text()
          lazy_anchor = "const AdminSystemPage = lazy(\n  () => import('../admin/AdminSystemPage'),\n)\n"
          lazy_insert = lazy_anchor + "const AdminRecoveryPage = lazy(\n  () => import('../admin/AdminRecoveryPage'),\n)\n"
          if "AdminRecoveryPage = lazy" not in s:
              if lazy_anchor not in s: raise SystemExit('AdminSystem lazy anchor not found')
              s = s.replace(lazy_anchor, lazy_insert, 1)
          route_anchor = '          <Route path="/admin/system" element={<AdminSystemPage />} />\n'
          route_insert = route_anchor + '          <Route path="/admin/recovery" element={<AdminRecoveryPage />} />\n'
          if 'path="/admin/recovery"' not in s:
              if route_anchor not in s: raise SystemExit('Admin system route anchor not found')
              s = s.replace(route_anchor, route_insert, 1)
          router.write_text(s)

          layout = Path('src/admin/AdminLayout.tsx')
          s = layout.read_text()
          if 'DatabaseBackup,' not in s:
              icon_anchor = '  Building2,\n'
              if icon_anchor not in s: raise SystemExit('icon anchor not found')
              s = s.replace(icon_anchor, icon_anchor + '  DatabaseBackup,\n', 1)
          item_anchor = "  {\n    name: 'Sustav',\n    path: '/admin/system',\n    icon: ServerCog,\n  },\n"
          item_insert = item_anchor + "  {\n    name: 'Recovery',\n    path: '/admin/recovery',\n    icon: DatabaseBackup,\n  },\n"
          if "path: '/admin/recovery'" not in s:
              if item_anchor not in s: raise SystemExit('system nav anchor not found')
              s = s.replace(item_anchor, item_insert, 1)
          layout.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - run: git diff --check
      - name: Commit validated route
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/router/AppRouter.tsx src/admin/AdminLayout.tsx
          git commit -m "Wire Admin Recovery into admin UI"
          git push origin HEAD:fix/local-first-durability-engine
