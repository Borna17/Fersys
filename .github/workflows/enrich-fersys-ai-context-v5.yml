name: Enrich FERSYS AI v5 context

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enrich-fersys-ai-context-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Add rich customer and document timing context
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'src/services/aiContext.service.ts'
          let s = fs.readFileSync(path, 'utf8')

          if (!s.includes('    phone: string\n    email: string\n    street: string')) {
            s = s.replace("    oib: string\n    city: string\n  }>", "    oib: string\n    phone: string\n    email: string\n    street: string\n    city: string\n    postalCode: string\n    contactPerson: string\n  }>")
            s = s.replace("        oib: customer.oib,\n        city: customer.city,", "        oib: customer.oib,\n        phone: customer.phone,\n        email: customer.email,\n        street: customer.street,\n        city: customer.city,\n        postalCode: customer.postalCode,\n        contactPerson: customer.contactPerson ?? '',")
          }

          if (!s.includes("    priority: CloudWorkOrder['priority']\n    createdAt: string")) {
            s = s.replace("    priority: CloudWorkOrder['priority']\n  }>", "    priority: CloudWorkOrder['priority']\n    createdAt: string\n    updatedAt: string\n  }>")
            s = s.replace("        priority: order.priority,\n      })),", "        priority: order.priority,\n        createdAt: String((order as any).createdAt ?? ''),\n        updatedAt: String((order as any).updatedAt ?? ''),\n      })),")
          }

          fs.writeFileSync(path, s)
          NODE
          npm ci
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/aiContext.service.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Enrich FERSYS AI v5 runtime context [skip ci]"
          git push
