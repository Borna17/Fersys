name: Apply Weather Settings UI
on:
  push:
    paths:
      - 'src/components/settings/WeatherMorningSettingsCard.tsx'
      - '.github/workflows/apply-weather-settings-ui.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Wire component
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/SettingsPage.tsx')
          s=p.read_text()
          imp="import WeatherMorningSettingsCard from '../components/settings/WeatherMorningSettingsCard'\n"
          anchor="import ModulesSettingsTab from '../components/settings/ModulesSettingsTab'\n"
          if imp not in s:
              if anchor not in s: raise SystemExit('Import anchor missing')
              s=s.replace(anchor,anchor+imp,1)
          render='''      <WeatherMorningSettingsCard />\n\n      <div className="xl:col-span-2">\n        <SettingsCard\n'''
          old='''      <div className="xl:col-span-2">\n        <SettingsCard\n          icon={\n            <Clock3 className="text-emerald-400" />\n          }\n          title="Regionalne postavke"'''
          new='''      <WeatherMorningSettingsCard />\n\n      <div className="xl:col-span-2">\n        <SettingsCard\n          icon={\n            <Clock3 className="text-emerald-400" />\n          }\n          title="Regionalne postavke"'''
          if '<WeatherMorningSettingsCard />' not in s:
              if old not in s: raise SystemExit('Notifications anchor missing')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Build
        run: npm run build
      - name: Commit generated wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/SettingsPage.tsx
          git commit -m "Show morning Weather settings in notifications"
          git push
