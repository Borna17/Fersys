name: Release readiness audit

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'eslint.config.js'
      - '.github/workflows/release-readiness-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21 for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install exact dependencies
        run: npm ci

      - name: TypeScript and production web build
        id: web_build
        run: npm run build

      - name: ESLint
        id: eslint
        continue-on-error: true
        run: npm run lint

      - name: Sync Android native project
        id: cap_sync
        continue-on-error: true
        run: npx cap sync android

      - name: Prepare CI-only Firebase config
        shell: bash
        run: |
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "fersys-ci-build",
              "storage_bucket": "fersys-ci-build.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.fersys.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "CI_ONLY_NOT_A_REAL_FIREBASE_KEY"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          test -s android/app/google-services.json

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Android lint
        id: android_lint
        continue-on-error: true
        working-directory: android
        run: ./gradlew lintDebug --no-daemon

      - name: Android debug compile
        id: android_build
        continue-on-error: true
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Dependency security review
        id: npm_audit
        continue-on-error: true
        shell: bash
        run: |
          # SheetJS xlsx is currently used only to CREATE FERSYS Excel exports.
          # The published high-severity advisories affect parsing crafted input.
          # Guard that invariant explicitly: if a read/import API is ever added,
          # this release check immediately fails and the dependency must be replaced.
          if grep -R -n -E 'XLSX\.(read|readFile)|sheet_to_json' src --include='*.ts' --include='*.tsx'; then
            echo "Unsafe SheetJS input parsing detected."
            exit 1
          fi

          set +e
          npm audit --json > npm-audit.json
          AUDIT_EXIT=$?
          set -e

          node <<'NODE'
          const fs = require('fs')
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'))
          const vulnerabilities = report.vulnerabilities || {}
          const blocking = []

          for (const [name, item] of Object.entries(vulnerabilities)) {
            const severity = String(item.severity || '').toLowerCase()
            if (severity !== 'high' && severity !== 'critical') continue

            // Reviewed exception: xlsx is write-only in src (guarded above), while
            // its current advisories require processing a crafted workbook input.
            if (name === 'xlsx') continue

            blocking.push(`${name}: ${severity}`)
          }

          if (blocking.length) {
            console.error('Blocking HIGH/CRITICAL dependency findings:')
            for (const finding of blocking) console.error(`- ${finding}`)
            process.exit(1)
          }

          const meta = report.metadata?.vulnerabilities || {}
          console.log(`npm audit totals: ${JSON.stringify(meta)}`)
          console.log('No exploitable HIGH/CRITICAL dependency finding is present in the current FERSYS usage path.')
          NODE

          # Preserve visibility of npm audit itself without treating the reviewed,
          # write-only xlsx advisory as an exploitable release blocker.
          if [[ "$AUDIT_EXIT" -ne 0 ]]; then
            echo "npm audit reported findings; reviewed by the security gate above."
          fi

      - name: Release gate
        if: always()
        shell: bash
        run: |
          echo "ESLint: ${{ steps.eslint.outcome }}"
          echo "Capacitor sync: ${{ steps.cap_sync.outcome }}"
          echo "Android lint: ${{ steps.android_lint.outcome }}"
          echo "Android build: ${{ steps.android_build.outcome }}"
          echo "Dependency security: ${{ steps.npm_audit.outcome }}"

          if [[ "${{ steps.eslint.outcome }}" != "success" || \
                "${{ steps.cap_sync.outcome }}" != "success" || \
                "${{ steps.android_lint.outcome }}" != "success" || \
                "${{ steps.android_build.outcome }}" != "success" || \
                "${{ steps.npm_audit.outcome }}" != "success" ]]; then
            echo "Release readiness audit failed. Review the failed checks above."
            exit 1
          fi

          echo "Release readiness audit passed."
