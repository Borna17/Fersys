name: Release readiness audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-readiness-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: TypeScript and production web build
        run: npm run build

      - name: ESLint
        run: npm run lint

      - name: Sync Android native project
        run: npx cap sync android

      - name: Android lint
        working-directory: android
        run: ./gradlew lintDebug --no-daemon

      - name: Android debug compile
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: High severity dependency audit
        run: npm audit --audit-level=high
