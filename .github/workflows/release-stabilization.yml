name: Release stabilization

on:
  push:
    branches: [release-stabilization-1.0.8-11]
    paths:
      - '.github/workflows/release-stabilization.yml'
      - '.github/scripts/release_stabilization.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stabilize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply stabilization patch
        run: python .github/scripts/release_stabilization.py

      - name: TypeScript and production build
        run: npm run build

      - name: Lint stabilization files
        run: |
          npx eslint \
            vite.config.ts \
            src/types/vehicle.ts \
            src/services/vehicles.service.ts \
            src/services/incomingInvoiceAi.service.ts \
            src/services/workOrders.service.ts \
            src/pages/NewIncomingInvoicePage.tsx \
            src/pages/VehicleDetailsPage.tsx \
            src/components/ConnectionStatusNotice.tsx \
            src/utils/deliveryNotePdf.ts

      - name: Release invariants
        run: |
          grep -q "name: 'FERSYS Business'" vite.config.ts
          grep -q "syncPendingUserDrafts" src/components/ConnectionStatusNotice.tsx
          grep -q "OfferTemplatesPanel" src/pages/NewOfferPage.tsx
          grep -q "fuelLiters" src/services/incomingInvoiceAi.service.ts
          grep -q "fuel_liters" src/services/vehicles.service.ts
          grep -q "paginateItems" src/utils/offerPdf.ts
          grep -q "paginateItems" src/utils/invoicePdf.ts
          grep -q "safeBreaks" src/utils/deliveryNotePdf.ts
          grep -q "canvasScaleY" src/utils/deliveryNotePdf.ts
          grep -q "images: \[\]" src/services/workOrders.service.ts

      - name: Commit stabilization changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vite.config.ts src/types/vehicle.ts src/services/vehicles.service.ts src/services/incomingInvoiceAi.service.ts src/services/workOrders.service.ts src/pages/NewIncomingInvoicePage.tsx src/pages/VehicleDetailsPage.tsx src/components/ConnectionStatusNotice.tsx src/utils/deliveryNotePdf.ts
          if git diff --cached --quiet; then
            echo "No stabilization changes to commit."
            exit 0
          fi
          git commit -m "Fix large work order saves with many photos [skip ci]"
          git push origin HEAD:release-stabilization-1.0.8-11
