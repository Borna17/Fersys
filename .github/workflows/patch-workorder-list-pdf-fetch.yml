name: Apply work order list PDF fetch fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Patch
        run: node scripts/patch-workorder-list-pdf-fetch.mjs
      - name: Build
        run: npm run build
      - name: Commit
        run: |
          if git diff --quiet -- src/pages/WorkOrdersPage.tsx; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/WorkOrdersPage.tsx
          git commit -m "fix: fetch full work order before PDF download"
          git push origin HEAD:main
