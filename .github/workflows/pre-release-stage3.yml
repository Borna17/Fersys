name: Pre-release stage three

on:
  push:
    branches:
      - pre-release-field-service-upgrade
    paths:
      - '.github/workflows/pre-release-stage3.yml'
      - '.github/scripts/pre_release_stage3.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pre-release-field-service-upgrade
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python .github/scripts/pre_release_stage3.py
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Verify
        run: |
          grep -q 'to="/account"' src/components/Sidebar.tsx
          grep -q 'AppLanguageSelector' src/pages/AccountPage.tsx
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Sidebar.tsx src/pages/AccountPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Expose personal settings and language to all users [skip ci]"
          git push origin HEAD:pre-release-field-service-upgrade
