name: FERSYS professional polish 2026-09-13

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fersys_professional_polish_20260913.py'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply professional polish fixes
        run: python .github/scripts/fersys_professional_polish_20260913.py

      - name: Build web app
        run: npm run build

      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CustomersPage.tsx src/pages/DashboardPage.tsx src/components/FloatingUiLayoutFix.tsx src/utils/offerPdf.ts src/admin/AdminSupportPage.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Polish dashboard, business flow, offers and support [skip ci]"
          git push
