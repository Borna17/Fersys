name: Harden employee time sync

on:
  push:
    paths:
      - '.github/workflows/harden-employee-time-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply worker sync hardening
        run: python .github/scripts/harden_employee_time_sync.py
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit
        run: |
          git config user.name "FERSYS Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Harden employee hours AI and work-order sync"
            git push origin HEAD:main
          fi
