name: Apply universal FERSYS draft protection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-universal-draft-protection.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch draft service and app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path('src/services/drafts.service.ts')
          text = service.read_text(encoding='utf-8')

          old_union = """export type DraftType =\n  | 'work-order'\n  | 'offer'\n  | 'invoice'\n  | 'inventory-item'"""
          new_union = """export type DraftType =\n  | 'work-order'\n  | 'offer'\n  | 'invoice'\n  | 'inventory-item'\n  | 'delivery-note'\n  | 'incoming-invoice'\n  | 'customer'\n  | 'vehicle'\n  | 'employee'\n  | 'form'"""
          if old_union in text:
              text = text.replace(old_union, new_union, 1)

          marker = "const LAST_SYNC_KEY =\n  'fersys-draft-last-sync-v1'\n"
          manifest_code = r'''
const DRAFT_MANIFEST_KEY =
  'fersys-draft-manifest-v1'

export type DraftManifestEntry = {
  draftType: DraftType
  draftKey: string
  label: string
  route: string
  updatedAt: string
}

function draftMeta(
  draftType: DraftType,
  draftKey: string,
  payload: unknown,
): { label: string; route: string } {
  const source =
    payload && typeof payload === 'object'
      ? (payload as Record<string, unknown>)
      : null

  const meta =
    source?.__draftMeta &&
    typeof source.__draftMeta === 'object'
      ? (source.__draftMeta as Record<string, unknown>)
      : null

  const explicitLabel =
    typeof meta?.label === 'string'
      ? meta.label.trim()
      : ''
  const explicitRoute =
    typeof meta?.route === 'string'
      ? meta.route.trim()
      : ''

  if (explicitLabel && explicitRoute) {
    return {
      label: explicitLabel,
      route: explicitRoute,
    }
  }

  const editId =
    draftKey.startsWith('edit:')
      ? draftKey.slice(5)
      : ''

  switch (draftType) {
    case 'work-order':
      return {
        label: editId
          ? 'Uređivanje radnog naloga'
          : 'Novi radni nalog',
        route: editId
          ? `/work-orders/${editId}/edit`
          : '/work-orders/new',
      }
    case 'offer':
      return {
        label: editId
          ? 'Uređivanje ponude'
          : 'Nova ponuda',
        route: editId
          ? `/offers/${editId}/edit`
          : '/offers/new',
      }
    case 'invoice':
      return {
        label: editId
          ? 'Uređivanje računa'
          : 'Novi račun',
        route: editId
          ? `/invoices/${editId}/edit`
          : '/invoices/new',
      }
    case 'inventory-item':
      return {
        label: editId
          ? 'Uređivanje artikla'
          : 'Novi artikl',
        route: editId
          ? `/inventory/${editId}/edit`
          : '/inventory/new',
      }
    case 'delivery-note':
      return {
        label: editId
          ? 'Uređivanje otpremnice'
          : 'Nova otpremnica',
        route: editId
          ? `/delivery-notes/new?edit=${encodeURIComponent(editId)}`
          : '/delivery-notes/new',
      }
    case 'incoming-invoice':
      return {
        label: editId
          ? 'Uređivanje ulaznog računa'
          : 'Novi ulazni račun',
        route: editId
          ? `/incoming-invoices/${editId}/edit`
          : '/incoming-invoices/new',
      }
    case 'customer':
      return {
        label: editId
          ? 'Uređivanje investitora'
          : 'Novi investitor',
        route: editId
          ? `/customers/${editId}`
          : '/customers',
      }
    case 'vehicle':
      return {
        label: editId
          ? 'Uređivanje vozila'
          : 'Novo vozilo',
        route: editId
          ? `/vehicles/${editId}`
          : '/vehicles',
      }
    case 'employee':
      return {
        label: editId
          ? 'Uređivanje zaposlenika'
          : 'Novi zaposlenik',
        route: '/settings/employees',
      }
    default:
      return {
        label: explicitLabel || 'Nedovršeni unos',
        route: explicitRoute || '/dashboard',
      }
  }
}

function readDraftManifest(): DraftManifestEntry[] {
  try {
    const raw = localStorage.getItem(DRAFT_MANIFEST_KEY)
    if (!raw) return []
    const value = JSON.parse(raw) as DraftManifestEntry[]
    return Array.isArray(value) ? value : []
  } catch {
    return []
  }
}

function writeDraftManifest(entries: DraftManifestEntry[]) {
  try {
    localStorage.setItem(
      DRAFT_MANIFEST_KEY,
      JSON.stringify(entries),
    )
  } catch {
    // Manifest je pomoćni prikaz; IndexedDB nacrt ostaje glavni izvor sigurnosti.
  }
}

function rememberDraftManifest(
  draftType: DraftType,
  draftKey: string,
  payload: unknown,
  updatedAt: string,
) {
  const meta = draftMeta(draftType, draftKey, payload)
  const next: DraftManifestEntry = {
    draftType,
    draftKey,
    label: meta.label,
    route: meta.route,
    updatedAt,
  }

  const current = readDraftManifest().filter(
    (entry) =>
      !(
        entry.draftType === draftType &&
        entry.draftKey === draftKey
      ),
  )

  writeDraftManifest([next, ...current].slice(0, 100))
}

function forgetDraftManifest(
  draftType: DraftType,
  draftKey: string,
) {
  writeDraftManifest(
    readDraftManifest().filter(
      (entry) =>
        !(
          entry.draftType === draftType &&
          entry.draftKey === draftKey
        ),
    ),
  )
}

export function getDraftManifestEntries() {
  return readDraftManifest().sort(
    (a, b) =>
      new Date(b.updatedAt).getTime() -
      new Date(a.updatedAt).getTime(),
  )
}
'''
          if 'DRAFT_MANIFEST_KEY' not in text:
              if marker not in text:
                  raise SystemExit('draft manifest insertion marker missing')
              text = text.replace(marker, marker + manifest_code, 1)

          save_marker = "  await putLocal(\n    envelope,\n  )\n\n  window.dispatchEvent("
          save_repl = "  await putLocal(\n    envelope,\n  )\n\n  rememberDraftManifest(\n    draftType,\n    draftKey,\n    payload,\n    updatedAt,\n  )\n\n  window.dispatchEvent("
          if 'rememberDraftManifest(\n    draftType,' not in text:
              if save_marker not in text:
                  raise SystemExit('save manifest marker missing')
              text = text.replace(save_marker, save_repl, 1)

          delete_marker = "  await deleteLocal(\n    key,\n  )\n\n  window.dispatchEvent("
          delete_repl = "  await deleteLocal(\n    key,\n  )\n\n  forgetDraftManifest(\n    draftType,\n    draftKey,\n  )\n\n  window.dispatchEvent("
          if 'forgetDraftManifest(\n    draftType,' not in text:
              if delete_marker not in text:
                  raise SystemExit('delete manifest marker missing')
              text = text.replace(delete_marker, delete_repl, 1)

          service.write_text(text, encoding='utf-8')

          app = Path('src/App.tsx')
          app_text = app.read_text(encoding='utf-8')
          if "UniversalDraftProtection" not in app_text:
              app_text = app_text.replace(
                  "import CroatianNavigationLabels from './components/CroatianNavigationLabels'\n",
                  "import CroatianNavigationLabels from './components/CroatianNavigationLabels'\nimport UniversalDraftProtection from './components/UniversalDraftProtection'\n",
                  1,
              )
              app_text = app_text.replace(
                  "      <CroatianNavigationLabels />\n",
                  "      <CroatianNavigationLabels />\n      <UniversalDraftProtection />\n",
                  1,
              )
          app.write_text(app_text, encoding='utf-8')
          PY

      - name: Create universal protection component
        shell: bash
        run: |
          cat > src/components/UniversalDraftProtection.tsx <<'EOF'
          import {
            AlertTriangle,
            ChevronRight,
            FilePenLine,
            Trash2,
            X,
          } from 'lucide-react'
          import {
            useEffect,
            useMemo,
            useState,
          } from 'react'

          import {
            deleteUserDraft,
            getDraftManifestEntries,
            loadUserDraft,
            saveUserDraft,
            type DraftManifestEntry,
          } from '../services/drafts.service'

          type SavedControl = {
            key: string
            tag: string
            type: string
            value: string
            checked?: boolean
          }

          type UniversalPayload = {
            __draftMeta: {
              label: string
              route: string
            }
            controls: SavedControl[]
            controlCount: number
          }

          const SAVE_DELAY_MS = 350
          const SUCCESS_WINDOW_MS = 20000
          const RESTORE_MAX_ATTEMPTS = 12

          function routeKey() {
            return `route:${window.location.pathname}${window.location.search}`
          }

          function isPublicOrAdmin(path: string) {
            return (
              path === '/' ||
              path.startsWith('/login') ||
              path.startsWith('/register') ||
              path.startsWith('/reset-password') ||
              path.startsWith('/terms') ||
              path.startsWith('/privacy') ||
              path.startsWith('/cookies') ||
              path.startsWith('/refund-policy') ||
              path.startsWith('/admin') ||
              path.startsWith('/delete-account')
            )
          }

          function hasStructuredDraft(path: string) {
            if (path === '/work-orders/new') return true
            if (/^\/work-orders\/[^/]+\/edit\/?$/.test(path)) return true
            if (path === '/offers/new') return true
            if (path === '/invoices/new') return true
            return false
          }

          function labelForRoute(path: string) {
            if (path.includes('/work-orders')) return 'Radni nalog – nespremljene izmjene'
            if (path.includes('/offers')) return 'Ponuda – nespremljene izmjene'
            if (path.includes('/invoices')) return 'Račun – nespremljene izmjene'
            if (path.includes('/incoming-invoices')) return 'Ulazni račun – nedovršeni unos'
            if (path.includes('/delivery-notes')) return 'Otpremnica – nedovršeni unos'
            if (path.includes('/customers')) return 'Investitor – nedovršeni unos'
            if (path.includes('/inventory')) return 'Skladište – nedovršeni unos'
            if (path.includes('/vehicles')) return 'Vozilo – nedovršeni unos'
            if (path.includes('/employees')) return 'Zaposlenik – nedovršeni unos'
            if (path.includes('/calendar')) return 'Kalendar – nedovršene izmjene'
            if (path.includes('/settings')) return 'Postavke – nespremljene izmjene'
            return 'Nedovršeni unos'
          }

          function visibleForms() {
            return Array.from(document.querySelectorAll<HTMLFormElement>('form')).filter(
              (form) => {
                const style = window.getComputedStyle(form)
                if (style.display === 'none' || style.visibility === 'hidden') return false
                const rect = form.getBoundingClientRect()
                return rect.width > 0 && rect.height > 0
              },
            )
          }

          function controls(form: HTMLFormElement) {
            return Array.from(
              form.querySelectorAll<
                HTMLInputElement | HTMLTextAreaElement | HTMLSelectElement
              >('input:not([type="file"]), textarea, select'),
            ).filter((control) => !control.disabled)
          }

          function seriousForm(form: HTMLFormElement) {
            const editable = controls(form).filter((control) => {
              if (control instanceof HTMLInputElement && control.type === 'hidden') return false
              return true
            })
            if (editable.length < 2) return false

            const submit = form.querySelector<HTMLElement>(
              'button[type="submit"], input[type="submit"]',
            )
            if (submit) return true

            const buttons = Array.from(form.querySelectorAll<HTMLButtonElement>('button'))
            return buttons.some((button) =>
              /(spremi|dodaj|kreiraj|izradi|potvrdi|ažuriraj|uredi|izdaj)/i.test(
                button.textContent ?? '',
              ),
            )
          }

          function activeForm() {
            return visibleForms().find(seriousForm) ?? null
          }

          function controlKey(
            control: HTMLInputElement | HTMLTextAreaElement | HTMLSelectElement,
            index: number,
          ) {
            return (
              control.dataset.draftKey ||
              control.id ||
              control.getAttribute('name') ||
              control.getAttribute('aria-label') ||
              control.getAttribute('placeholder') ||
              `${control.tagName.toLowerCase()}:${control instanceof HTMLInputElement ? control.type : ''}:${index}`
            )
          }

          function snapshot(form: HTMLFormElement): SavedControl[] {
            return controls(form).map((control, index) => ({
              key: controlKey(control, index),
              tag: control.tagName,
              type: control instanceof HTMLInputElement ? control.type : '',
              value: control.value,
              checked:
                control instanceof HTMLInputElement &&
                (control.type === 'checkbox' || control.type === 'radio')
                  ? control.checked
                  : undefined,
            }))
          }

          function setNativeValue(
            control: HTMLInputElement | HTMLTextAreaElement | HTMLSelectElement,
            saved: SavedControl,
          ) {
            if (
              control instanceof HTMLInputElement &&
              (control.type === 'checkbox' || control.type === 'radio')
            ) {
              if (
                typeof saved.checked === 'boolean' &&
                control.checked !== saved.checked
              ) {
                control.click()
              }
              return
            }

            if (control.value === saved.value) return

            const prototype =
              control instanceof HTMLInputElement
                ? HTMLInputElement.prototype
                : control instanceof HTMLTextAreaElement
                  ? HTMLTextAreaElement.prototype
                  : HTMLSelectElement.prototype

            const setter = Object.getOwnPropertyDescriptor(
              prototype,
              'value',
            )?.set
            setter?.call(control, saved.value)
            control.dispatchEvent(new Event('input', { bubbles: true }))
            control.dispatchEvent(new Event('change', { bubbles: true }))
          }

          function findAddButton() {
            const buttons = Array.from(document.querySelectorAll<HTMLButtonElement>('button'))
            return buttons.find((button) => {
              if (button.disabled) return false
              const text = (button.textContent ?? '').trim()
              return /dodaj (stavku|materijal|red|artikl)|nova stavka|još jednu stavku/i.test(text)
            })
          }

          function tryOpenModalForRoute(path: string) {
            if (!['/customers', '/vehicles', '/settings/employees'].includes(path)) return false
            const buttons = Array.from(document.querySelectorAll<HTMLButtonElement>('button'))
            const button = buttons.find((item) => {
              const text = (item.textContent ?? '').trim()
              if (path === '/customers') return /(dodaj|novi).*(investitor|kupac)/i.test(text)
              if (path === '/vehicles') return /(dodaj|novo).*(vozilo)/i.test(text)
              return /(dodaj|novi).*(zaposlenik|radnik|korisnik)/i.test(text)
            })
            button?.click()
            return Boolean(button)
          }

          function restoreControls(
            form: HTMLFormElement,
            payload: UniversalPayload,
          ) {
            let current = controls(form)

            if (current.length < payload.controlCount) {
              const add = findAddButton()
              if (add) add.click()
              return false
            }

            const byKey = new Map<string, SavedControl>()
            payload.controls.forEach((item) => byKey.set(item.key, item))

            current.forEach((control, index) => {
              const key = controlKey(control, index)
              const saved = byKey.get(key) ?? payload.controls[index]
              if (!saved || control.tagName !== saved.tag) return
              setNativeValue(control, saved)
            })

            return true
          }

          function formatTime(value: string) {
            const date = new Date(value)
            if (Number.isNaN(date.getTime())) return ''
            return date.toLocaleString('hr-HR', {
              day: '2-digit',
              month: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
            })
          }

          export default function UniversalDraftProtection() {
            const [entries, setEntries] = useState<DraftManifestEntry[]>([])
            const [open, setOpen] = useState(false)
            const [restoredMessage, setRestoredMessage] = useState('')

            const refresh = () => {
              setEntries(getDraftManifestEntries())
            }

            useEffect(() => {
              refresh()
              const onChange = () => refresh()
              window.addEventListener('fersys:draft-sync-change', onChange)
              window.addEventListener('storage', onChange)
              const timer = window.setInterval(refresh, 2500)
              return () => {
                window.removeEventListener('fersys:draft-sync-change', onChange)
                window.removeEventListener('storage', onChange)
                window.clearInterval(timer)
              }
            }, [])

            useEffect(() => {
              if (!entries.length || document.visibilityState !== 'visible') return
              if (!('Notification' in window) || Notification.permission !== 'granted') return

              const newest = entries[0]
              const age = Date.now() - new Date(newest.updatedAt).getTime()
              if (age < 30 * 60 * 1000) return

              const notificationKey = 'fersys-draft-notification-v1'
              const last = Number(localStorage.getItem(notificationKey) ?? '0')
              if (Date.now() - last < 6 * 60 * 60 * 1000) return

              try {
                new Notification('FERSYS – imate nedovršeno', {
                  body:
                    entries.length === 1
                      ? entries[0].label
                      : `Imate ${entries.length} nedovršenih unosa ili izmjena.`,
                })
                localStorage.setItem(notificationKey, String(Date.now()))
              } catch {
                // In-app upozorenje ostaje dostupno i kad OS ne dopušta lokalnu notifikaciju.
              }
            }, [entries])

            useEffect(() => {
              let timer = 0
              let watcher = 0
              let dirty = false
              let submittedAt = 0
              let submittedKey = ''
              let restoredKey = ''
              let restoreAttempts = 0
              let lastLocation = ''

              const currentLocation = () =>
                `${window.location.pathname}${window.location.search}`

              const eligible = () => {
                const path = window.location.pathname
                return !isPublicOrAdmin(path) && !hasStructuredDraft(path)
              }

              const saveNow = () => {
                if (!eligible() || !dirty) return
                const form = activeForm()
                if (!form) return

                const key = routeKey()
                const route = currentLocation()
                const payload: UniversalPayload = {
                  __draftMeta: {
                    label: labelForRoute(window.location.pathname),
                    route,
                  },
                  controls: snapshot(form),
                  controlCount: controls(form).length,
                }

                void saveUserDraft('form', key, payload).then(refresh).catch((error) => {
                  console.warn('[FERSYS] Univerzalni autosave nije uspio:', error)
                })
              }

              const scheduleSave = () => {
                window.clearTimeout(timer)
                timer = window.setTimeout(saveNow, SAVE_DELAY_MS)
              }

              const restore = async () => {
                if (!eligible()) return
                const key = routeKey()
                if (restoredKey === key) return

                const draft = await loadUserDraft<UniversalPayload>('form', key).catch(() => null)
                if (!draft?.payload) {
                  restoredKey = key
                  return
                }

                let form = activeForm()
                if (!form && tryOpenModalForRoute(window.location.pathname)) {
                  return
                }
                form = activeForm()
                if (!form) return

                const done = restoreControls(form, draft.payload)
                restoreAttempts += 1
                if (!done && restoreAttempts < RESTORE_MAX_ATTEMPTS) return

                restoredKey = key
                dirty = true
                setRestoredMessage(
                  `Vraćene su nespremljene izmjene · ${formatTime(draft.updatedAt)}`,
                )
                window.setTimeout(() => setRestoredMessage(''), 5500)
              }

              const onInput = (event: Event) => {
                const target = event.target as Element | null
                const form = target?.closest('form') as HTMLFormElement | null
                if (!form || !seriousForm(form) || !eligible()) return
                dirty = true
                scheduleSave()
              }

              const onSubmit = (event: Event) => {
                const form = event.target as HTMLFormElement | null
                if (!form || !seriousForm(form) || !eligible()) return
                dirty = true
                submittedAt = Date.now()
                submittedKey = routeKey()
                saveNow()
              }

              const onVisibility = () => {
                if (document.visibilityState === 'hidden') saveNow()
              }

              document.addEventListener('input', onInput, true)
              document.addEventListener('change', onInput, true)
              document.addEventListener('submit', onSubmit, true)
              document.addEventListener('visibilitychange', onVisibility)
              window.addEventListener('pagehide', saveNow)
              window.addEventListener('beforeunload', saveNow)

              watcher = window.setInterval(() => {
                const location = currentLocation()
                if (location !== lastLocation) {
                  lastLocation = location
                  restoredKey = ''
                  restoreAttempts = 0
                  dirty = false
                }

                void restore()

                if (
                  submittedKey &&
                  submittedAt > 0 &&
                  Date.now() - submittedAt < SUCCESS_WINDOW_MS
                ) {
                  const routeChanged = routeKey() !== submittedKey
                  const formGone = !activeForm()
                  if (routeChanged || formGone) {
                    void deleteUserDraft('form', submittedKey).then(() => {
                      submittedKey = ''
                      submittedAt = 0
                      dirty = false
                      refresh()
                    })
                  }
                }
              }, 300)

              return () => {
                saveNow()
                window.clearTimeout(timer)
                window.clearInterval(watcher)
                document.removeEventListener('input', onInput, true)
                document.removeEventListener('change', onInput, true)
                document.removeEventListener('submit', onSubmit, true)
                document.removeEventListener('visibilitychange', onVisibility)
                window.removeEventListener('pagehide', saveNow)
                window.removeEventListener('beforeunload', saveNow)
              }
            }, [])

            const visibleEntries = useMemo(
              () =>
                entries.filter(
                  (entry) =>
                    entry.route &&
                    !entry.route.startsWith('/login'),
                ),
              [entries],
            )

            if (!visibleEntries.length && !restoredMessage) {
              return null
            }

            return (
              <>
                {restoredMessage && (
                  <div className="fixed bottom-24 left-1/2 z-[120] -translate-x-1/2 rounded-2xl border border-emerald-400/25 bg-slate-950/95 px-4 py-3 text-sm font-bold text-emerald-200 shadow-2xl backdrop-blur sm:bottom-8">
                    {restoredMessage}
                  </div>
                )}

                {visibleEntries.length > 0 && (
                  <button
                    type="button"
                    onClick={() => setOpen(true)}
                    className="fixed bottom-20 left-3 z-[115] flex max-w-[calc(100vw-1.5rem)] items-center gap-3 rounded-2xl border border-amber-400/25 bg-slate-950/95 px-4 py-3 text-left text-white shadow-2xl backdrop-blur sm:bottom-5 sm:left-5"
                  >
                    <span className="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-amber-400/15 text-amber-300">
                      <FilePenLine size={20} />
                    </span>
                    <span className="min-w-0">
                      <span className="block text-xs font-black uppercase tracking-wide text-amber-300">
                        Nedovršeno ({visibleEntries.length})
                      </span>
                      <span className="block truncate text-xs text-slate-400">
                        {visibleEntries[0].label}
                      </span>
                    </span>
                    <ChevronRight size={18} className="shrink-0 text-slate-500" />
                  </button>
                )}

                {open && (
                  <div className="fixed inset-0 z-[130] grid place-items-end bg-black/70 p-0 backdrop-blur-sm sm:place-items-center sm:p-5">
                    <section className="max-h-[86dvh] w-full overflow-hidden rounded-t-[2rem] border border-slate-700 bg-slate-950 shadow-2xl sm:max-w-xl sm:rounded-[2rem]">
                      <header className="flex items-start justify-between gap-4 border-b border-slate-800 p-5">
                        <div>
                          <p className="text-[10px] font-black uppercase tracking-[0.2em] text-amber-400">
                            SIGURNOSNE SKICE
                          </p>
                          <h2 className="mt-1 text-xl font-black text-white">
                            Imate nedovršeno
                          </h2>
                          <p className="mt-1 text-sm text-slate-400">
                            FERSYS čuva unos dok ga uspješno ne spremite ili sami ne odbacite.
                          </p>
                        </div>
                        <button
                          type="button"
                          onClick={() => setOpen(false)}
                          className="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-slate-900 text-slate-400"
                        >
                          <X size={19} />
                        </button>
                      </header>

                      <div className="max-h-[60dvh] space-y-2 overflow-y-auto p-4">
                        {visibleEntries.map((entry) => (
                          <article
                            key={`${entry.draftType}:${entry.draftKey}`}
                            className="flex items-center gap-3 rounded-2xl border border-slate-800 bg-slate-900 p-3"
                          >
                            <span className="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-amber-400/10 text-amber-300">
                              <AlertTriangle size={19} />
                            </span>
                            <button
                              type="button"
                              onClick={() => {
                                setOpen(false)
                                window.location.href = entry.route
                              }}
                              className="min-w-0 flex-1 text-left"
                            >
                              <strong className="block truncate text-sm text-white">
                                {entry.label}
                              </strong>
                              <span className="mt-1 block text-xs text-slate-500">
                                {formatTime(entry.updatedAt)} · Nastavi
                              </span>
                            </button>
                            <button
                              type="button"
                              title="Odbaci skicu"
                              onClick={() => {
                                if (!window.confirm(`Odbaciti: ${entry.label}?`)) return
                                void deleteUserDraft(entry.draftType, entry.draftKey).then(refresh)
                              }}
                              className="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-red-500/10 text-red-300"
                            >
                              <Trash2 size={17} />
                            </button>
                          </article>
                        ))}
                      </div>
                    </section>
                  </div>
                )}
              </>
            )
          }
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit universal draft protection
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/drafts.service.ts src/components/UniversalDraftProtection.tsx src/App.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Protect unfinished FERSYS forms across the app"
          git push
