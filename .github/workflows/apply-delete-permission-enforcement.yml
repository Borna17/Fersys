name: Apply delete permission enforcement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-delete-permission-enforcement.yml'
      - 'scripts/apply-delete-permission-enforcement.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source changes
        run: node scripts/apply-delete-permission-enforcement.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit applied source
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/permissionGuard.service.ts src/services/customers.service.ts src/services/workOrders.service.ts src/services/offers.service.ts src/services/invoices.service.ts src/services/incomingInvoices.service.ts src/services/inventory.service.ts src/services/vehicles.service.ts src/services/deliveryNotes.service.ts src/services/employees.service.ts
          git commit -m "Enforce granular delete permissions"
          git push origin main
