name: Apply employee offline cache

on:
  push:
    branches:
      - fix/local-first-durability-engine
    paths:
      - scripts/apply-employee-offline-cache.mjs
      - .github/workflows/apply-employee-offline-cache.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/local-first-durability-engine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply employee offline cache
        run: node scripts/apply-employee-offline-cache.mjs
      - run: npm ci
      - run: npm run build
      - run: git diff --check
      - name: Commit verified employee cache
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/employees.service.ts
          git commit -m "Cache employees for offline work order editing"
          git push origin HEAD:fix/local-first-durability-engine
