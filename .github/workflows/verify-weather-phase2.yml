name: Verify FERSYS Weather Phase 2
on:
  push:
    branches: [main]
    paths:
      - 'src/services/weatherPreferences.service.ts'
      - 'src/components/WeatherNotificationSettings.tsx'
      - 'src/pages/NotificationSettingsPage.tsx'
      - '.github/workflows/verify-weather-phase2.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
