name: Fix invoice PDF pagination

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore invoice PDF source and improve pagination
        run: |
          git show fbeaf9d6b8768115b82bcaa7a247f8dc426b430c:src/utils/invoicePdf.ts > src/utils/invoicePdf.ts
          python - <<'PY'
          from pathlib import Path
          path = Path('src/utils/invoicePdf.ts')
          text = path.read_text()
          old = """    const finalCapacity = isFirst ? 6 : 8\n\n    if (remaining <= finalCapacity) {"""
          new = """    // Normal invoices with up to 8 standard rows fit on the first A4 page\n    // together with totals and the HUB3 barcode. The old limit of 6 forced\n    // short invoices (7–8 rows) onto an unnecessary second page.\n    const finalCapacity = isFirst ? 8 : 10\n\n    if (remaining <= finalCapacity) {"""
          if old not in text:
              raise SystemExit('Expected pagination block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/invoicePdf.ts
          git commit -m "Fix unnecessary invoice PDF page breaks"
          git push
