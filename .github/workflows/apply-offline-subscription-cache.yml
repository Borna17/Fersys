name: Apply offline subscription cache

on:
  push:
    branches: [fix/local-first-durability-engine]
    paths:
      - '.github/workflows/apply-offline-subscription-cache.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch SubscriptionProvider for offline startup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/subscription/SubscriptionProvider.tsx')
          s=p.read_text()
          s=s.replace("import { useAuth } from '../auth/AuthProvider'\n", "import { useAuth } from '../auth/AuthProvider'\nimport { readOfflineSubscription, rememberOfflineSubscription } from './offlineSubscription'\n", 1)
          s=s.replace("    isAccessLoading,\n  } = useAuth()", "    isAccessLoading,\n    isOfflineAccess,\n  } = useAuth()", 1)
          old="""      const shouldBlock =
        initializedCompanyRef.current !== companyId

      try {
"""
          new="""      const shouldBlock =
        initializedCompanyRef.current !== companyId

      const cached = readOfflineSubscription(session.user.id, companyId)
      if (!navigator.onLine || isOfflineAccess) {
        if (cached) {
          setSubscription(cached)
          initializedCompanyRef.current = companyId
          setError('')
        } else {
          setSubscription(null)
          setError('Pretplata još nije dostupna offline. Spoji uređaj na internet barem jednom.')
        }
        setIsLoading(false)
        return
      }

      try {
"""
          if old not in s: raise SystemExit('subscription block anchor missing')
          s=s.replace(old,new,1)
          old2="""        setSubscription(context)
        initializedCompanyRef.current = companyId
"""
          new2="""        setSubscription(context)
        rememberOfflineSubscription(session.user.id, companyId, context)
        initializedCompanyRef.current = companyId
"""
          if old2 not in s: raise SystemExit('subscription success anchor missing')
          s=s.replace(old2,new2,1)
          old3="""      membership?.companyId,
      session?.user.id,
    ])
"""
          new3="""      membership?.companyId,
      session?.user.id,
      isOfflineAccess,
    ])
"""
          if old3 not in s: raise SystemExit('subscription deps anchor missing')
          s=s.replace(old3,new3,1)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit verified patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/subscription/SubscriptionProvider.tsx
          git diff --cached --check
          git commit -m 'Allow verified subscription context during offline startup'
          git push
