name: Apply work order recovery hardening

on:
  push:
    branches:
      - fix/local-first-durability-engine
    paths:
      - '.github/workflows/apply-work-order-recovery-hardening.yml'
      - 'scripts/apply-work-order-recovery-hardening.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/local-first-durability-engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply deterministic recovery patch
        run: node scripts/apply-work-order-recovery-hardening.mjs
      - run: npm ci
      - run: npm run build
      - run: git diff --check
      - name: Commit verified recovery hardening
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/EditWorkOrderPage.tsx
          git commit -m 'Harden work order local recovery before save'
          git push origin HEAD:fix/local-first-durability-engine
