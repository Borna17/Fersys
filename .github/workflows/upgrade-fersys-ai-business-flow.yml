name: Harden FERSYS PDF pagination

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-fersys-ai-business-flow.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply adaptive pagination without changing document design
        run: python .github/scripts/harden_all_document_pagination_v2.py

      - name: Verify PDF safeguards
        run: |
          python - <<'PY'
          from pathlib import Path

          engine = Path('src/utils/pdfLayoutEngine.ts').read_text(encoding='utf-8')
          offer = Path('src/utils/offerPdf.ts').read_text(encoding='utf-8')
          invoice = Path('src/utils/invoicePdf.ts').read_text(encoding='utf-8')
          work = Path('src/utils/workOrderPdf.ts').read_text(encoding='utf-8')

          checks = {
              'engine': [
                  'stabilizeAdaptiveTableDocument',
                  'pdfPageOverflows',
                  'expectedRowCount',
              ],
              'offer': [
                  "from './pdfLayoutEngine'",
                  'data-pdf-row',
                  'data-pdf-table',
                  'data-pdf-final',
                  'stabilizeOfferPdfLayout',
                  'data-pdf-continuation-template',
              ],
              'invoice': [
                  "from './pdfLayoutEngine'",
                  'data-pdf-row',
                  'data-pdf-table',
                  'data-pdf-final',
                  'stabilizeInvoicePdfLayout',
                  'data-pdf-continuation-template',
                  "split('·')[0]",
              ],
              'work': [
                  'reflowRenderedPdfPages',
                  'insertionAnchor(next, selector)',
                  'insertionAnchor(current, selector)',
                  'data-photo-card',
                  'PDF fotografije nisu potpune',
                  'PDF blokovi nisu u ispravnom redoslijedu',
              ],
          }

          values = {
              'engine': engine,
              'offer': offer,
              'invoice': invoice,
              'work': work,
          }

          for name, required in checks.items():
              missing = [item for item in required if item not in values[name]]
              if missing:
                  raise SystemExit(f'{name}: missing {missing}')

          print('All FERSYS PDF safeguards verified.')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit adaptive document renderers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/utils/offerPdf.ts src/utils/invoicePdf.ts src/utils/workOrderPdf.ts
          if git diff --cached --quiet; then
            echo 'No generated PDF changes.'
            exit 0
          fi
          git commit -m 'Make offer invoice and work-order pagination adaptive [skip ci]'
          git push
