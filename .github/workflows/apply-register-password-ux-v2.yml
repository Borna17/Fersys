name: Apply register password UX v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-register-password-ux-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply source changes
        run: python .github/scripts/fix_register_password_strength.py
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Commit changes
        run: |
          git config user.name "FERSYS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/RegisterPage.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix registration password strength and generator"
          git push
