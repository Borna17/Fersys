name: Fix work order PDF material overflow

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_work_order_pdf_first_page_material_overflow.py'
      - '.github/workflows/fix-work-order-pdf-material-overflow.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply material pagination fix
        run: python .github/scripts/fix_work_order_pdf_first_page_material_overflow.py

      - name: Verify source invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/utils/workOrderPdf.ts')
          t = p.read_text(encoding='utf-8')
          required = [
              'descriptionVisualLines',
              'descriptionVisualLines >= 22',
              '? 0',
              'page-break-inside: avoid;',
              'break-inside: avoid;',
          ]
          missing = [x for x in required if x not in t]
          if missing:
              raise SystemExit(f'Missing expected PDF overflow safeguards: {missing}')
          print('PDF pagination safeguards verified.')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit generated source change
        run: |
          if git diff --quiet -- src/utils/workOrderPdf.ts; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/utils/workOrderPdf.ts
          git commit -m 'Prevent work order PDF material rows from being clipped'
          git push

# Trigger: 2026-09-05 material rows must never be clipped between A4 pages.
