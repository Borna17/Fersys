name: Apply FERSYS manual placement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-manual-placement.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update manual placement
        shell: python
        run: |
          from pathlib import Path

          # 1) Remove standalone manual item from the sidebar.
          p = Path('src/components/Sidebar.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace("  BookOpen,\n  Bot,", "  Bot,")
          s = s.replace("  feature?: SubscriptionFeature\n  static?: boolean\n}>", "  feature?: SubscriptionFeature\n}>")
          manual_block = """\n  {\n    name: 'Korisnički priručnik',\n    path: '/prirucnik.html',\n    icon: BookOpen,\n    permission:\n      'dashboard.view',\n    static: true,\n  },\n"""
          s = s.replace(manual_block, '')
          s = s.replace("""            can(\n              item.permission,\n            ) &&\n            (\n              item.static ||\n              isPathEnabled(\n                item.path,\n              )\n            ),""", """            can(\n              item.permission,\n            ) &&\n            isPathEnabled(\n              item.path,\n            ),""")
          s = s.replace("""              reloadDocument={\n                item.static\n              }\n""", '')
          p.write_text(s, encoding='utf-8')

          # 2) Put the manual prominently inside Support, while preserving tickets/messages.
          p = Path('src/pages/SupportPage.tsx')
          s = p.read_text(encoding='utf-8')
          if '  BookOpen,' not in s:
              s = s.replace("  AlertTriangle,\n", "  AlertTriangle,\n  BookOpen,\n  Download,\n  ExternalLink,\n")

          marker = """      {error && (\n"""
          card = """      <section className=\"overflow-hidden rounded-3xl border border-violet-500/20 bg-gradient-to-br from-violet-500/10 via-slate-900 to-blue-500/10 p-4 sm:p-5\">\n        <div className=\"flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between\">\n          <div className=\"flex min-w-0 items-start gap-3\">\n            <div className=\"grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-violet-500/15 text-violet-300\">\n              <BookOpen size={22} />\n            </div>\n            <div className=\"min-w-0\">\n              <p className=\"text-[10px] font-black uppercase tracking-[0.2em] text-violet-300\">POMOĆ PRIJE SLANJA ZAHTJEVA</p>\n              <h2 className=\"mt-1 text-lg font-black text-white sm:text-xl\">Korisnički priručnik</h2>\n              <p className=\"mt-1 max-w-3xl text-sm leading-6 text-slate-400\">\n                Otvori službeni FERSYS PDF vodič s prikazima aplikacije i kratkim uputama. Ako ne pronađeš rješenje, pošalji poruku podršci ispod.\n              </p>\n            </div>\n          </div>\n\n          <div className=\"grid shrink-0 grid-cols-2 gap-2 sm:flex\">\n            <a\n              href=\"/FERSYS-Korisnicki-prirucnik.pdf\"\n              target=\"_blank\"\n              rel=\"noopener noreferrer\"\n              className=\"inline-flex min-h-11 items-center justify-center gap-2 rounded-xl bg-violet-600 px-4 text-sm font-black text-white transition hover:bg-violet-500\"\n            >\n              <ExternalLink size={17} />\n              Otvori PDF\n            </a>\n            <a\n              href=\"/FERSYS-Korisnicki-prirucnik.pdf\"\n              download=\"FERSYS-Korisnicki-prirucnik.pdf\"\n              className=\"inline-flex min-h-11 items-center justify-center gap-2 rounded-xl border border-slate-700 bg-slate-950 px-4 text-sm font-black text-slate-200 transition hover:border-slate-600 hover:bg-slate-800\"\n            >\n              <Download size={17} />\n              Preuzmi\n            </a>\n          </div>\n        </div>\n      </section>\n\n"""
          if 'POMOĆ PRIJE SLANJA ZAHTJEVA' not in s:
              s = s.replace(marker, card + marker, 1)
          p.write_text(s, encoding='utf-8')

          # 3) Add a public PDF download link on the login/public page.
          p = Path('src/pages/LoginPage.tsx')
          s = p.read_text(encoding='utf-8')
          old = """            <p className=\"mt-6 text-center text-xs text-slate-600\">\n              Zaštićeni pristup poslovnim podacima\n            </p>"""
          new = """            <div className=\"mt-6 flex flex-wrap items-center justify-center gap-x-3 gap-y-2 text-xs\">\n              <a\n                href=\"/FERSYS-Korisnicki-prirucnik.pdf\"\n                download=\"FERSYS-Korisnicki-prirucnik.pdf\"\n                className=\"font-bold text-violet-300 transition hover:text-violet-200\"\n              >\n                Preuzmi korisnički priručnik (PDF)\n              </a>\n              <span className=\"text-slate-700\">•</span>\n              <span className=\"text-slate-600\">Zaštićeni pristup poslovnim podacima</span>\n            </div>"""
          if 'Preuzmi korisnički priručnik (PDF)' not in s:
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          # 4) Remove Canva from the public manual page and point only to the PDF.
          p = Path('public/prirucnik.html')
          s = p.read_text(encoding='utf-8')
          old = '<a class="btn primary" href="https://www.canva.com/d/maG_M5ehrfIrgwe" target="_blank" rel="noopener noreferrer">Otvori priručnik ↗</a>\n          <a class="btn secondary" href="/support">FERSYS podrška</a>'
          new = '<a class="btn primary" href="/FERSYS-Korisnicki-prirucnik.pdf" target="_blank" rel="noopener noreferrer">Otvori PDF ↗</a>\n          <a class="btn secondary" href="/FERSYS-Korisnicki-prirucnik.pdf" download="FERSYS-Korisnicki-prirucnik.pdf">Preuzmi PDF ↓</a>\n          <a class="btn secondary" href="/support">FERSYS podrška</a>'
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "FERSYS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/Sidebar.tsx src/pages/SupportPage.tsx src/pages/LoginPage.tsx public/prirucnik.html
          git commit -m "Place user manual in support and public PDF links"
          git push
