name: Apply work order share action patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Patch share action
        run: node scripts/patch-workorder-share-action.mjs

      - name: Build
        run: npm run build

      - name: Commit generated source
        run: |
          FILE="src/pages/WorkOrderDetailsPage.tsx"
          if git diff --quiet -- "$FILE"; then
            echo "No source changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "feat: add share action to work order details"
          git push origin HEAD:main
