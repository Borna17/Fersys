name: Apply company verification UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-company-verification-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch registration and admin UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # RegisterPage: OIB state
          replace_once('src/pages/RegisterPage.tsx',
          "  const [\n    companyName,\n    setCompanyName,\n  ] = useState('')\n",
          "  const [\n    companyName,\n    setCompanyName,\n  ] = useState('')\n\n  const [\n    companyOib,\n    setCompanyOib,\n  ] = useState('')\n")

          # RegisterPage: OIB required + validation
          replace_once('src/pages/RegisterPage.tsx',
          "      !companyName.trim() ||\n      !normalizedEmail ||",
          "      !companyName.trim() ||\n      !companyOib.trim() ||\n      !normalizedEmail ||")

          replace_once('src/pages/RegisterPage.tsx',
          "    const currentPasswordError =\n      getPasswordError(\n        password,\n      )\n",
          "    const normalizedCompanyOib =\n      companyOib.replace(/\\D/g, '')\n\n    if (!/^\\d{11}$/.test(normalizedCompanyOib)) {\n      setError(\n        'OIB tvrtke ili obrta mora sadržavati točno 11 znamenki.',\n      )\n      return\n    }\n\n    const currentPasswordError =\n      getPasswordError(\n        password,\n      )\n")

          replace_once('src/pages/RegisterPage.tsx',
          "                company_name:\n                  companyName.trim(),\n                account_type:",
          "                company_name:\n                  companyName.trim(),\n                company_oib:\n                  normalizedCompanyOib,\n                account_type:")

          # RegisterPage: OIB field
          replace_once('src/pages/RegisterPage.tsx',
          "                </div>\n\n                <Field\n                  label=\"E-mail adresa\"",
          "                </div>\n\n                <Field\n                  label=\"OIB tvrtke ili obrta\"\n                  icon={\n                    <Building2\n                      size={19}\n                    />\n                  }\n                >\n                  <input\n                    type=\"text\"\n                    inputMode=\"numeric\"\n                    autoComplete=\"off\"\n                    value={companyOib}\n                    onChange={(event) =>\n                      setCompanyOib(\n                        event.target.value\n                          .replace(/\\D/g, '')\n                          .slice(0, 11),\n                      )\n                    }\n                    placeholder=\"11 znamenki OIB-a\"\n                    maxLength={11}\n                    className=\"auth-input\"\n                  />\n                </Field>\n\n                <Field\n                  label=\"E-mail adresa\"")

          replace_once('src/pages/RegisterPage.tsx',
          "              Prvi korisnik automatski postaje vlasnik tvrtke.",
          "              Nova tvrtka postaje aktivna nakon provjere FERSYS administratora.")

          replace_once('src/pages/RegisterPage.tsx',
          "        'Registracija je uspješna. Provjeri e-mail i potvrdi račun, a zatim se prijavi.',",
          "        'Registracija je zaprimljena. Provjeri e-mail i potvrdi račun. Nakon potvrde FERSYS administrator će pregledati prijavu i aktivirati tvrtku.',")

          # AuthProvider: idempotent admin notification after bootstrap
          p = Path('src/auth/AuthProvider.tsx')
          text = p.read_text(encoding='utf-8')
          needle = "        await ensureCompanyForCurrentUser()\n\n        const nextMembership ="
          repl = "        await ensureCompanyForCurrentUser()\n\n        void supabase.functions\n          .invoke('company-registration-notify')\n          .catch(() => undefined)\n\n        const nextMembership ="
          if needle not in text:
              raise SystemExit('AuthProvider prepareCompany pattern not found')
          text = text.replace(needle, repl, 1)
          needle2 = "      await ensureCompanyForCurrentUser()\n      const nextMembership ="
          repl2 = "      await ensureCompanyForCurrentUser()\n      void supabase.functions\n        .invoke('company-registration-notify')\n        .catch(() => undefined)\n      const nextMembership ="
          if needle2 not in text:
              raise SystemExit('AuthProvider retry pattern not found')
          text = text.replace(needle2, repl2, 1)
          p.write_text(text, encoding='utf-8')

          # AppRouter: clear pending/rejected states
          replace_once('src/router/AppRouter.tsx',
          "  if (!membership || membership.status !== 'active') {\n    return <AccessDeniedPage title=\"Račun nema aktivan pristup\" description=\"Obrati se vlasniku ili administratoru tvrtke.\" />\n  }",
          "  if (membership?.role === 'owner' && membership.status === 'inactive') {\n    return <AccessDeniedPage title=\"Registracija čeka potvrdu\" description=\"Tvoja prijava je zaprimljena. FERSYS administrator mora potvrditi tvrtku prije prvog korištenja. Dobit ćeš pristup čim prijava bude odobrena.\" />\n  }\n  if (membership?.role === 'owner' && membership.status === 'blocked') {\n    return <AccessDeniedPage title=\"Registracija nije odobrena\" description=\"Za dodatne informacije obrati se FERSYS podršci.\" />\n  }\n  if (!membership || membership.status !== 'active') {\n    return <AccessDeniedPage title=\"Račun nema aktivan pristup\" description=\"Obrati se vlasniku ili administratoru tvrtke.\" />\n  }")

          # Admin verification service
          Path('src/admin/services/companyVerification.service.ts').write_text(r'''import { supabase } from '../../lib/supabase'

export type CompanyRegistrationRequest = {
  companyId: string
  companyName: string
  companyOib: string
  companyCode: string
  ownerId: string
  ownerName: string
  ownerEmail: string
  submittedAt: string
  verificationStatus: 'pending' | 'rejected'
  rejectionReason: string
}

export async function getCompanyRegistrationRequests(): Promise<CompanyRegistrationRequest[]> {
  const { data, error } = await supabase.rpc('admin_get_pending_company_registrations_v1')
  if (error) throw error
  return (data ?? []).map((row: Record<string, unknown>) => ({
    companyId: String(row.company_id ?? ''),
    companyName: String(row.company_name ?? ''),
    companyOib: String(row.company_oib ?? ''),
    companyCode: String(row.company_code ?? ''),
    ownerId: String(row.owner_id ?? ''),
    ownerName: String(row.owner_name ?? ''),
    ownerEmail: String(row.owner_email ?? ''),
    submittedAt: String(row.submitted_at ?? ''),
    verificationStatus: String(row.verification_status ?? 'pending') as 'pending' | 'rejected',
    rejectionReason: String(row.rejection_reason ?? ''),
  }))
}

export async function approveCompanyRegistration(companyId: string): Promise<void> {
  const { error } = await supabase.rpc('admin_approve_company_registration_v1', {
    requested_company_id: companyId,
  })
  if (error) throw error
}

export async function rejectCompanyRegistration(companyId: string, reason: string): Promise<void> {
  const { error } = await supabase.rpc('admin_reject_company_registration_v1', {
    requested_company_id: companyId,
    requested_reason: reason.trim() || null,
  })
  if (error) throw error
}
''', encoding='utf-8')

          # Admin verification panel
          Path('src/admin/AdminCompanyVerificationPanel.tsx').write_text(r'''import { AlertTriangle, CheckCircle2, Clock3, RefreshCw, ShieldCheck, XCircle } from 'lucide-react'
import { useCallback, useEffect, useMemo, useState } from 'react'

import {
  approveCompanyRegistration,
  getCompanyRegistrationRequests,
  rejectCompanyRegistration,
  type CompanyRegistrationRequest,
} from './services/companyVerification.service'

export default function AdminCompanyVerificationPanel() {
  const [items, setItems] = useState<CompanyRegistrationRequest[]>([])
  const [loading, setLoading] = useState(true)
  const [workingId, setWorkingId] = useState('')
  const [error, setError] = useState('')

  const load = useCallback(async () => {
    try {
      setLoading(true)
      setError('')
      setItems(await getCompanyRegistrationRequests())
    } catch (value) {
      setError(value instanceof Error ? value.message : 'Zahtjeve nije moguće učitati.')
    } finally {
      setLoading(false)
    }
  }, [])

  useEffect(() => { void load() }, [load])

  const pending = useMemo(
    () => items.filter((item) => item.verificationStatus === 'pending'),
    [items],
  )

  async function approve(item: CompanyRegistrationRequest) {
    if (!window.confirm(`Potvrditi tvrtku ${item.companyName} (OIB ${item.companyOib})?`)) return
    try {
      setWorkingId(item.companyId)
      setError('')
      await approveCompanyRegistration(item.companyId)
      await load()
    } catch (value) {
      setError(value instanceof Error ? value.message : 'Tvrtku nije moguće potvrditi.')
    } finally {
      setWorkingId('')
    }
  }

  async function reject(item: CompanyRegistrationRequest) {
    const reason = window.prompt('Razlog odbijanja (opcionalno):', '')
    if (reason === null) return
    if (!window.confirm(`Odbiti prijavu za ${item.companyName}?`)) return
    try {
      setWorkingId(item.companyId)
      setError('')
      await rejectCompanyRegistration(item.companyId, reason)
      await load()
    } catch (value) {
      setError(value instanceof Error ? value.message : 'Prijavu nije moguće odbiti.')
    } finally {
      setWorkingId('')
    }
  }

  return (
    <section className="mt-7 overflow-hidden rounded-3xl border border-amber-500/20 bg-gradient-to-br from-amber-500/[0.08] via-slate-900 to-violet-500/[0.06]">
      <div className="flex flex-col gap-4 border-b border-slate-800 p-5 sm:flex-row sm:items-center sm:justify-between">
        <div className="flex items-start gap-3">
          <div className="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-amber-500/10 text-amber-300">
            <ShieldCheck size={22} />
          </div>
          <div>
            <div className="flex flex-wrap items-center gap-2">
              <h2 className="text-xl font-black text-white">Zahtjevi za registraciju</h2>
              {pending.length > 0 && (
                <span className="rounded-full bg-amber-500 px-2.5 py-1 text-xs font-black text-slate-950">{pending.length} čeka</span>
              )}
            </div>
            <p className="mt-1 max-w-3xl text-sm leading-6 text-slate-400">
              Nova tvrtka ne može koristiti FERSYS dok je ovdje ne potvrdiš. Provjeri naziv, OIB, vlasnika i e-mail prije odobravanja.
            </p>
          </div>
        </div>

        <button type="button" onClick={() => void load()} disabled={loading} className="inline-flex min-h-11 items-center justify-center gap-2 rounded-xl border border-slate-700 bg-slate-950 px-4 text-sm font-black text-slate-300 disabled:opacity-50">
          <RefreshCw size={17} className={loading ? 'animate-spin' : ''} />
          Osvježi
        </button>
      </div>

      {error && (
        <div className="m-4 flex items-start gap-2 rounded-2xl border border-red-500/20 bg-red-500/10 p-4 text-sm text-red-300">
          <AlertTriangle size={18} className="mt-0.5 shrink-0" />
          {error}
        </div>
      )}

      {loading ? (
        <div className="p-8 text-center text-sm text-slate-500">Učitavanje zahtjeva...</div>
      ) : pending.length === 0 ? (
        <div className="flex items-center gap-3 p-5 text-sm text-slate-400">
          <CheckCircle2 size={20} className="text-emerald-400" />
          Trenutno nema novih prijava koje čekaju potvrdu.
        </div>
      ) : (
        <div className="divide-y divide-slate-800">
          {pending.map((item) => (
            <article key={item.companyId} className="grid gap-4 p-5 xl:grid-cols-[1.2fr_1fr_auto] xl:items-center">
              <div className="min-w-0">
                <p className="font-black text-white">{item.companyName}</p>
                <div className="mt-2 flex flex-wrap gap-x-5 gap-y-1 text-xs text-slate-400">
                  <span>OIB <strong className="text-slate-200">{item.companyOib || '—'}</strong></span>
                  <span>Kod <strong className="text-slate-200">{item.companyCode || '—'}</strong></span>
                </div>
              </div>

              <div className="text-sm">
                <p className="font-bold text-slate-200">{item.ownerName || 'Vlasnik nije naveden'}</p>
                <p className="mt-1 text-xs text-slate-500">{item.ownerEmail || 'Nema e-maila'}</p>
                <p className="mt-2 inline-flex items-center gap-1.5 text-xs text-slate-500">
                  <Clock3 size={14} />
                  {item.submittedAt ? new Date(item.submittedAt).toLocaleString('hr-HR') : '—'}
                </p>
              </div>

              <div className="grid grid-cols-2 gap-2 xl:w-[230px]">
                <button type="button" disabled={workingId === item.companyId} onClick={() => void approve(item)} className="inline-flex min-h-11 items-center justify-center gap-2 rounded-xl bg-emerald-600 px-3 text-sm font-black text-white hover:bg-emerald-500 disabled:opacity-50">
                  <CheckCircle2 size={17} />
                  Potvrdi
                </button>
                <button type="button" disabled={workingId === item.companyId} onClick={() => void reject(item)} className="inline-flex min-h-11 items-center justify-center gap-2 rounded-xl border border-red-500/25 bg-red-500/10 px-3 text-sm font-black text-red-300 hover:bg-red-500/15 disabled:opacity-50">
                  <XCircle size={17} />
                  Odbij
                </button>
              </div>
            </article>
          ))}
        </div>
      )}
    </section>
  )
}
''', encoding='utf-8')

          # Admin Companies: add panel
          replace_once('src/admin/AdminCompaniesPage.tsx',
          "import { Link } from 'react-router'\n\nimport {",
          "import { Link } from 'react-router'\n\nimport AdminCompanyVerificationPanel from './AdminCompanyVerificationPanel'\n\nimport {")

          replace_once('src/admin/AdminCompaniesPage.tsx',
