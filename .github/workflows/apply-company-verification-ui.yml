name: Apply company verification UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-company-verification-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply source changes
        run: python .github/scripts/apply_company_verification_ui.py

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Commit changes
        run: |
          rm -f .github/workflows/apply-company-verification-ui.yml
          rm -f .github/scripts/apply_company_verification_ui.py
          git config user.name "FERSYS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Secure company registration with admin verification"
          git push
