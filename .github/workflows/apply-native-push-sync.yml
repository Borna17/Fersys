name: Apply Native Push Sync

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-native-push-sync.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/apply-native-push-sync.mjs
      - run: npm run build
      - name: Commit verified changes
        run: |
          git config user.name "FERSYS Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/router/AppRouter.tsx src/components/PushRegistrationSync.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Sync native FERSYS push registration"
          git push
