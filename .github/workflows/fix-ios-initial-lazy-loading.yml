name: Fix iOS initial lazy loading
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_ios_initial_lazy_loading.py'
      - '.github/workflows/fix-ios-initial-lazy-loading.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python .github/scripts/fix_ios_initial_lazy_loading.py
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/router/AppRouter.tsx
          git commit -m "Fix iOS startup module loading [skip ci]"
          git push
