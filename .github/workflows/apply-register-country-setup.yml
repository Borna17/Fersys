name: Apply registration country setup

on:
  push:
    paths:
      - '.github/scripts/apply_register_country_setup.py'
      - '.github/workflows/apply-register-country-setup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/apply_register_country_setup.py

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'FERSYS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/pages/RegisterPage.tsx src/auth/AuthProvider.tsx
          git commit -m 'Configure company country during registration'
          git push
