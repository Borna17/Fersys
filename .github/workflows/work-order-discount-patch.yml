name: Apply work-order discount patch

on:
  push:
    branches:
      - fix/work-order-mobile-sharing-session

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/work-order-mobile-sharing-session
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply discount patch
        run: node scripts/run-work-order-discount-patch.mjs

      - name: Build
        run: npm run build

      - name: Commit generated source changes
        run: |
          if git diff --quiet -- src/pages/NewWorkOrderPage.tsx src/pages/EditWorkOrderPage.tsx src/services/workOrders.service.ts; then
            echo "No generated source changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/NewWorkOrderPage.tsx src/pages/EditWorkOrderPage.tsx src/services/workOrders.service.ts
          git commit -m "feat: wire work order discounts into forms"
          git push origin HEAD:fix/work-order-mobile-sharing-session
