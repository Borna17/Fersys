name: Apply work-order discount patch

on:
  push:
    branches:
      - fix/work-order-mobile-sharing-session

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/work-order-mobile-sharing-session
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply output discount patch
        run: node scripts/apply-work-order-discount-output.mjs

      - name: Build
        run: npm run build

      - name: Commit generated source changes
        run: |
          FILES="src/pages/WorkOrderDetailsPage.tsx src/utils/workOrderPdf.ts"
          if git diff --quiet -- $FILES; then
            echo "No generated source changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "feat: complete work order discount output"
          git push origin HEAD:fix/work-order-mobile-sharing-session
