name: Apply FERSYS auth logo
on:
  push:
    paths:
      - '.github/workflows/apply-auth-logo.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace placeholder branding
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/pages/LoginPage.tsx')
          s = p.read_text()
          old = '''          <div className="flex items-center gap-3">
            <div className="flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-violet-500 to-blue-600 shadow-lg shadow-violet-500/20">
              <span className="text-xl font-black">
                F
              </span>
            </div>

            <div>
              <p className="text-xl font-black tracking-wide">
                FERSYS
              </p>
              <p className="text-sm text-slate-400">
                Business Management System
              </p>
            </div>
          </div>'''
          new = '''          <div className="flex items-center">
            <img
              src="/fersys-auth-logo.svg"
              alt="FERSYS"
              className="h-auto w-44 object-contain"
            />
          </div>'''
          if old not in s:
              raise SystemExit('Desktop login branding block not found')
          s = s.replace(old, new, 1)

          old2 = '''            <div className="mb-7 flex items-center gap-3 lg:hidden">
              <div className="flex h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-br from-violet-500 to-blue-600">
                <span className="text-lg font-black">
                  F
                </span>
              </div>

              <div>
                <p className="font-black">
                  FERSYS
                </p>
                <p className="text-xs text-slate-400">
                  Business Management System
                </p>
              </div>
            </div>'''
          new2 = '''            <div className="mb-7 flex justify-center lg:hidden">
              <img
                src="/fersys-auth-logo.svg"
                alt="FERSYS"
                className="h-auto w-40 object-contain"
              />
            </div>'''
          if old2 not in s:
              raise SystemExit('Mobile login branding block not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)

          p = Path('src/pages/RegisterPage.tsx')
          s = p.read_text()
          old3 = '''            <div className="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-violet-500 to-blue-600 shadow-lg shadow-violet-500/20">
              <span className="text-xl font-black">
                F
              </span>
            </div>'''
          new3 = '''            <img
              src="/fersys-auth-logo.svg"
              alt="FERSYS"
              className="mx-auto h-auto w-44 object-contain sm:w-48"
            />'''
          if old3 not in s:
              raise SystemExit('Register branding block not found')
          s = s.replace(old3, new3, 1)
          p.write_text(s)
          PY
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit
        run: |
          git config user.name "FERSYS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/LoginPage.tsx src/pages/RegisterPage.tsx
          git commit -m "Use FERSYS logo on login and registration"
          git push