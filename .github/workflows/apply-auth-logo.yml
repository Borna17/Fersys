name: Apply FERSYS auth logo
on:
  push:
    paths:
      - '.github/workflows/apply-auth-logo.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace placeholder branding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          login = Path('src/pages/LoginPage.tsx')
          s = login.read_text(encoding='utf-8')

          desktop_pattern = re.compile(
              r'<div className="flex items-center gap-3">\s*'
              r'<div className="flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-violet-500 to-blue-600 shadow-lg shadow-violet-500/20">.*?'
              r'Business Management System\s*</p>\s*</div>\s*</div>',
              re.S,
          )
          desktop_replacement = '''<div className="flex items-center">
            <img
              src="/fersys-auth-logo.svg"
              alt="FERSYS"
              className="h-auto w-44 object-contain"
            />
          </div>'''
          s, count = desktop_pattern.subn(desktop_replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'Desktop login branding replacement count: {count}')

          mobile_pattern = re.compile(
              r'<div className="mb-7 flex items-center gap-3 lg:hidden">.*?'
              r'Business Management System\s*</p>\s*</div>\s*</div>',
              re.S,
          )
          mobile_replacement = '''<div className="mb-7 flex justify-center lg:hidden">
              <img
                src="/fersys-auth-logo.svg"
                alt="FERSYS"
                className="h-auto w-40 object-contain"
              />
            </div>'''
          s, count = mobile_pattern.subn(mobile_replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'Mobile login branding replacement count: {count}')

          login.write_text(s, encoding='utf-8')

          register = Path('src/pages/RegisterPage.tsx')
          s = register.read_text(encoding='utf-8')
          register_pattern = re.compile(
              r'<div className="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-violet-500 to-blue-600 shadow-lg shadow-violet-500/20">\s*'
              r'<span className="text-xl font-black">\s*F\s*</span>\s*</div>',
              re.S,
          )
          register_replacement = '''<img
              src="/fersys-auth-logo.svg"
              alt="FERSYS"
              className="mx-auto h-auto w-44 object-contain sm:w-48"
            />'''
          s, count = register_pattern.subn(register_replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'Register branding replacement count: {count}')

          register.write_text(s, encoding='utf-8')
          PY
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit
        run: |
          git config user.name "FERSYS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/LoginPage.tsx src/pages/RegisterPage.tsx
          git commit -m "Use FERSYS logo on login and registration"
          git push