name: Apply FERSYS Weather Phase 1

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-weather-phase1-final-v2.mjs

permissions:
  contents: write

jobs:
  apply-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Weather Phase 1
        run: node scripts/apply-weather-phase1-final-v2.mjs

      - name: Verify production build
        run: npm run build

      - name: Commit verified changes
        run: |
          git config user.name "FERSYS Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/services/weather.service.ts src/services/workOrders.service.ts src/types/workOrder.ts src/pages/DashboardPage.tsx src/pages/WorkOrderDetailsPage.tsx src/utils/workOrderPdf.ts
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Complete FERSYS Weather phase 1"
          git push
