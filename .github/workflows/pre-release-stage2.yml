name: Pre-release stage two

on:
  push:
    branches:
      - pre-release-field-service-upgrade
    paths:
      - '.github/workflows/pre-release-stage2.yml'
      - '.github/scripts/pre_release_stage2.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pre-release-field-service-upgrade
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply stage two
        run: python .github/scripts/pre_release_stage2.py
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Verify
        run: |
          grep -q "field-service-customer-notify" src/services/workOrders.service.ts
          grep -q "OfflineReadyNotice" src/main.tsx
          grep -q "Trenutna lokacija" src/pages/CustomersPage.tsx
          grep -q "FieldTodayPanel" src/main.tsx
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --quiet && exit 0
          git commit -m "Complete field workflow notifications and offline status [skip ci]"
          git push origin HEAD:pre-release-field-service-upgrade
