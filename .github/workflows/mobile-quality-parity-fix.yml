name: Mobile quality parity fix

on:
  push:
    branches:
      - pre-release-field-service-upgrade
    paths:
      - '.github/workflows/mobile-quality-parity-fix.yml'
      - '.github/scripts/mobile_quality_parity_fix.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pre-release-field-service-upgrade
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply mobile quality patch
        run: python .github/scripts/mobile_quality_parity_fix.py
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Verify key fixes
        run: |
          grep -q "Trenutna lokacija" src/pages/CustomersPage.tsx
          grep -q "AppLanguageRuntime" src/main.tsx
          grep -q "runtimeCache" src/services/customers.service.ts
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --quiet && exit 0
          git commit -m "Add pre-release field service improvements [skip ci]"
          git push origin HEAD:pre-release-field-service-upgrade
