name: Verify update prompts
on:
  push:
    branches: [ios-android-update-prompts]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Verify Android and iOS update support
        run: |
          grep -q "platform: 'android' | 'ios'" src/services/appUpdate.service.ts
          grep -q "Ažuriraj na App Storeu" src/components/AppUpdatePrompt.tsx
