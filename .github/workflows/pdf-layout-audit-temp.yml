name: PDF layout audit temp

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compact offer and work order pagination
        run: |
          python - <<'PY'
          from pathlib import Path

          offer = Path('src/utils/offerPdf.ts')
          text = offer.read_text()
          old = """  const finalUnitsCapacity =\n    hasImages\n      ? 5.4\n      : settings.density ===\n          'compact'\n        ? 8.2\n        : 7.2"""
          new = """  // Keep the closing/payment block with the last rows whenever the\n  // standard rows genuinely fit on the same A4 page. This avoids creating\n  // a nearly empty continuation page only for totals/HUB3. Rows with images\n  // remain conservative because their rendered height is much larger.\n  const finalUnitsCapacity =\n    hasImages\n      ? 5.4\n      : settings.density ===\n          'compact'\n        ? 9.0\n        : 8.2"""
          if old not in text:
              raise SystemExit('Offer capacity block not found')
          offer.write_text(text.replace(old, new, 1))

          work = Path('src/utils/workOrderPdf.ts')
          text = work.read_text()
          old = """      if (\n        tryPullWholeBlockBackward(\n          current,\n          next,\n          '[data-pdf-block=\"photos\"]',\n        )\n      ) {\n        changed = true\n      }"""
          new = """      if (\n        tryPullWholeBlockBackward(\n          current,\n          next,\n          '[data-pdf-block=\"photos\"]',\n        )\n      ) {\n        changed = true\n      }\n\n      // The final price/signature blocks must not live on an otherwise\n      // unnecessary continuation page. Pull them back in document order and\n      // keep each move only when the browser confirms the A4 page still fits.\n      if (\n        tryPullWholeBlockBackward(\n          current,\n          next,\n          '[data-pdf-block=\"totals\"]',\n        )\n      ) {\n        changed = true\n      }\n\n      if (\n        tryPullWholeBlockBackward(\n          current,\n          next,\n          '[data-pdf-block=\"signature\"]',\n        )\n      ) {\n        changed = true\n      }"""
          if old not in text:
              raise SystemExit('Work-order compaction block not found')
          work.write_text(text.replace(old, new, 1))
          PY

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript and production build
        run: npm run build

      - name: Commit verified PDF layout changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/offerPdf.ts src/utils/workOrderPdf.ts
          git commit -m "Compact PDF pagination across business documents"
          git push
