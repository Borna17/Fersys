name: Apply FERSYS Business sidebar brand

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-fersys-business-sidebar-brand.yml'

permissions:
  contents: write

jobs:
  branding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update sidebar branding
        run: python .github/scripts/apply_fersys_business_sidebar_brand.py

      - name: Build web app
        run: npm run build

      - name: Commit sidebar branding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Sidebar.tsx
          git commit -m "Use FERSYS Business logo in app sidebar [skip ci]"
          git push

# Retry with robust sidebar patch.
