name: Finalize multi-country fiscal foundation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/finalize_multi_country_fiscal_foundation.py'
      - '.github/scripts/finalize_fiscal_pdf_and_invoice.py'
      - '.github/scripts/harden_multi_country_compatibility.py'
      - '.github/workflows/finalize-multi-country-fiscal-foundation.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply idempotent source patches
        run: |
          python .github/scripts/finalize_multi_country_fiscal_foundation.py
          python .github/scripts/finalize_fiscal_pdf_and_invoice.py
          python .github/scripts/harden_multi_country_compatibility.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit verified changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/RegisterPage.tsx \
                  src/services/companySettings.service.ts \
                  src/pages/SettingsPage.tsx \
                  src/components/Topbar.tsx \
                  src/components/settings/ModulesSettingsTab.tsx \
                  src/services/customers.service.ts \
                  src/pages/CustomersPage.tsx \
                  src/pages/CustomerProfilePage.tsx \
                  src/services/inventory.service.ts \
                  src/pages/NewInventoryItemPage.tsx \
                  src/utils/invoicePdf.ts
          git commit -m "Harden multi-country fiscalization compatibility"
          git pull --rebase origin main
          git push origin HEAD:main
