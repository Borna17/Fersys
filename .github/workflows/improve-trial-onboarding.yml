name: Improve trial onboarding
on:
  push:
    branches: [improve-trial-onboarding]
    paths:
      - '.github/scripts/improve_trial_onboarding.py'
      - '.github/workflows/improve-trial-onboarding.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve-trial-onboarding
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply trial onboarding copy
        run: python .github/scripts/improve_trial_onboarding.py
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Lint changed app files
        run: npx eslint src/pages/LoginPage.tsx src/pages/RegisterPage.tsx src/pages/PricingPage.tsx
      - name: Verify trial messaging
        run: |
          grep -q "Započni 7 dana besplatno" src/pages/LoginPage.tsx
          grep -q "Bez kartice" src/pages/RegisterPage.tsx
          grep -q "bez automatske naplate" src/pages/PricingPage.tsx
          grep -q "Plaćanje još nije aktivirano" src/pages/PricingPage.tsx
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/LoginPage.tsx src/pages/RegisterPage.tsx src/pages/PricingPage.tsx
          git commit -m 'Clarify no-card Business trial flow [skip ci]'
          git push origin HEAD:improve-trial-onboarding
