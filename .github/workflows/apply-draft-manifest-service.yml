name: Apply draft manifest service

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-draft-manifest-service.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch drafts service
        shell: bash
        env:
          MANIFEST_B64: ""
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, os

          path = Path('src/services/drafts.service.ts')
          text = path.read_text(encoding='utf-8')

          old_union = "export type DraftType =\n  | 'work-order'\n  | 'offer'\n  | 'invoice'\n  | 'inventory-item'"
          new_union = old_union + "\n  | 'delivery-note'\n  | 'incoming-invoice'\n  | 'customer'\n  | 'vehicle'\n  | 'employee'\n  | 'form'"
          if old_union in text and "| 'form'" not in text:
              text = text.replace(old_union, new_union, 1)

          marker = "const LAST_SYNC_KEY =\n  'fersys-draft-last-sync-v1'\n"
          if 'DRAFT_MANIFEST_KEY' not in text:
              manifest = base64.b64decode(os.environ['MANIFEST_B64']).decode('utf-8')
              if marker not in text:
                  raise SystemExit('manifest marker missing')
              text = text.replace(marker, marker + manifest, 1)

          save_marker = "  await putLocal(\n    envelope,\n  )\n\n  window.dispatchEvent("
          if 'rememberDraftManifest(\n    draftType,' not in text:
              if save_marker not in text:
                  raise SystemExit('save marker missing')
              text = text.replace(
                  save_marker,
                  "  await putLocal(\n    envelope,\n  )\n\n  rememberDraftManifest(\n    draftType,\n    draftKey,\n    payload,\n    updatedAt,\n  )\n\n  window.dispatchEvent(",
                  1,
              )

          delete_marker = "  await deleteLocal(\n    key,\n  )\n\n  window.dispatchEvent("
          if 'forgetDraftManifest(\n    draftType,' not in text:
              if delete_marker not in text:
                  raise SystemExit('delete marker missing')
              text = text.replace(
                  delete_marker,
                  "  await deleteLocal(\n    key,\n  )\n\n  forgetDraftManifest(\n    draftType,\n    draftKey,\n  )\n\n  window.dispatchEvent(",
                  1,
              )

          path.write_text(text, encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit service patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/drafts.service.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Track and recover unfinished FERSYS drafts"
          git push
