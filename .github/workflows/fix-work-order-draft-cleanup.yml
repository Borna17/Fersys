name: Fix work order draft cleanup

on:
  push:
    paths:
      - '.github/scripts/fix_work_order_draft_cleanup.py'
      - '.github/workflows/fix-work-order-draft-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply cleanup patch
        run: python .github/scripts/fix_work_order_draft_cleanup.py
      - name: Verify build
        run: npm run build
      - name: Commit source fix
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/NewWorkOrderPage.tsx
          git commit -m 'Clear completed work order drafts immediately'
          git push
