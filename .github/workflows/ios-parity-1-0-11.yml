name: Apply iOS parity 1.0.11

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/ios_parity_1_0_11.py'
      - '.github/workflows/ios-parity-1-0-11.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python .github/scripts/ios_parity_1_0_11.py
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Verify iOS parity targets
        run: |
          grep -q "FERSYS se učitava" src/main.tsx
          grep -q "Capacitor.isNativePlatform" src/pages/WorkOrderDetailsPage.tsx
          grep -q "Spremi ili podijeli PDF ponude" src/utils/offerPdf.ts
          grep -q "fersys-app-icon-1024.png" src/components/MobileNotificationBell.tsx
          grep -q "relative z-40 flex min-w-0 items-center justify-start" src/layouts/AppLayout.tsx
          ! grep -q 'src="/logo.svg"' src/components/Sidebar.tsx
      - name: Commit generated parity fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx src/components/Sidebar.tsx src/layouts/AppLayout.tsx src/pages/WorkOrderDetailsPage.tsx src/utils/offerPdf.ts src/components/MobileNotificationBell.tsx supabase/functions/push-notifications/index.ts supabase/functions/campaign-notifications/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "Fix iOS parity, native PDF actions and loading [skip ci]"
          git push origin HEAD:main
