name: Fix Android work order performance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-android-workorder-performance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Android work order fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Native-safe downloads: browser anchors don't reliably download/open
          # blob URLs inside Android WebView. Save through Capacitor Filesystem and
          # hand the native file to Android's share/open sheet.
          p = Path('src/utils/downloadFeedback.ts')
          s = p.read_text(encoding='utf-8-sig')
          if "from '@capacitor/core'" not in s:
              s = "import { Capacitor } from '@capacitor/core'\n\n" + s

          start = s.index('export function saveBlobDownload(')
          replacement = r'''function blobToBase64(blob: Blob): Promise<string> {
  return new Promise((resolve, reject) => {
    const reader = new FileReader()

    reader.onload = () => {
      if (typeof reader.result !== 'string') {
        reject(new Error('Datoteku nije moguće pripremiti.'))
        return
      }

      const comma = reader.result.indexOf(',')
      resolve(comma >= 0 ? reader.result.slice(comma + 1) : reader.result)
    }

    reader.onerror = () =>
      reject(new Error('Datoteku nije moguće pripremiti.'))

    reader.readAsDataURL(blob)
  })
}

async function saveNativeBlobDownload(
  blob: Blob,
  fileName: string,
) {
  try {
    const [{ Filesystem, Directory }, { Share }] =
      await Promise.all([
        import('@capacitor/filesystem'),
        import('@capacitor/share'),
      ])

    const data = await blobToBase64(blob)
    const result = await Filesystem.writeFile({
      path: fileName,
      data,
      directory: Directory.Cache,
      recursive: true,
    })

    emit('fersys:download-complete', {
      fileName,
      message:
        'Dokument je spreman. Odaberi aplikaciju za otvaranje ili spremanje.',
    })

    await Share.share({
      title: fileName,
      text: 'FERSYS dokument',
      files: [result.uri],
      dialogTitle: 'Otvori ili spremi dokument',
    })

    return result.uri
  } catch (error) {
    console.error('[FERSYS] Native download nije uspio:', error)
    notifyDownloadError(
      error instanceof Error
        ? error.message
        : 'Dokument nije moguće otvoriti ili spremiti na uređaj.',
      fileName,
    )
    return ''
  }
}

/**
 * Web koristi standardni browser download. Android/iOS koriste native
 * Filesystem + Share jer WebView ne preuzima blob URL pouzdano.
 */
export function saveBlobDownload(
  blob: Blob,
  fileName: string,
) {
  if (Capacitor.isNativePlatform()) {
    void saveNativeBlobDownload(blob, fileName)
    return ''
  }

  const url = URL.createObjectURL(blob)
  const anchor = document.createElement('a')

  anchor.href = url
  anchor.download = fileName
  anchor.style.display = 'none'
  anchor.dataset.fersysSkipDownloadFeedback = 'true'

  document.body.appendChild(anchor)
  anchor.click()
  anchor.remove()

  emit('fersys:download-complete', {
    fileName,
    openUrl: url,
  })

  window.setTimeout(() => {
    URL.revokeObjectURL(url)
  }, 90_000)

  return url
}
'''
          s = s[:start] + replacement
          p.write_text(s, encoding='utf-8')

          # 2) Don't tell users a large PDF is broken after 10 seconds.
          p = Path('src/components/DownloadFeedbackCenter.tsx')
          s = p.read_text(encoding='utf-8-sig')
          old = """        () => {\n          clearButton()\n\n          setState({\n            status:\n              'warning',\n            title:\n              'Izrada traje dulje nego inače',\n            message:\n              'Dokument nije završen. Možeš pokušati ponovno.',\n          })\n\n          dismissTimer.current =\n            window.setTimeout(\n              () => {\n                setState(null)\n              },\n              WARNING_TIMEOUT_MS,\n            )\n        },"""
          new = """        () => {\n          setState((current) => ({\n            status: 'preparing',\n            title: 'Veći dokument – još ga pripremam...',\n            message:\n              'Radni nalog s više stavki ili fotografija može potrajati malo duže. Ne zatvaraj aplikaciju – FERSYS i dalje radi.',\n            fileName: current?.fileName,\n          }))\n        },"""
          if old not in s:
              raise SystemExit('Download slow-warning block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 3) Work-order mobile UX/performance.
          p = Path('src/pages/NewWorkOrderPage.tsx')
          s = p.read_text(encoding='utf-8-sig')
          for bad in ('Količina', 'KoliÄina', 'Kolaina'):
              s = s.replace(bad, 'Kolicina')

          # Smaller field photos = much less base64/DB/PDF work on phones while
          # keeping enough resolution for A4 documentation.
          s = s.replace(
              "await fileToCompressedDataUrl(\n                    file,\n                  )",
              "await fileToCompressedDataUrl(\n                    file,\n                    1280,\n                    1280,\n                    0.72,\n                  )",
          )

          marker = """  if (customersError) {\n    return ("""
          if marker not in s:
              raise SystemExit('Customer error marker not found')
          # Insert saving screen after customer-error block by anchoring the main return.
          main_return = """  return (\n    <>\n      <form"""
          saving = """  if (isSaving) {\n    const isLargeWorkOrder =\n      images.length >= 4 ||\n      materials.length >= 8 ||\n      description.length >= 1500\n\n    return (\n      <FersysLoader\n        text={\n          isLargeWorkOrder\n            ? 'Spremanje većeg radnog naloga... Ima više podataka ili fotografija pa može potrajati malo duže. Ne zatvaraj aplikaciju.'\n            : 'Spremanje radnog naloga...'\n        }\n      />\n    )\n  }\n\n"""
          if saving.strip() not in s:
              if main_return not in s:
                  raise SystemExit('Main work-order return marker not found')
              s = s.replace(main_return, saving + main_return, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Commit verified fixes
        shell: bash
        run: |
          git config user.name "FERSYS Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/utils/downloadFeedback.ts src/components/DownloadFeedbackCenter.tsx src/pages/NewWorkOrderPage.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Android PDF downloads and large work order UX"
          git push
