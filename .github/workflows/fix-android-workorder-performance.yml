name: Fix Android work order performance

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-android-workorder-performance.py'
      - '.github/workflows/fix-android-workorder-performance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Android work order fixes
        run: python3 scripts/fix-android-workorder-performance.py
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Commit verified fixes
        shell: bash
        run: |
          git config user.name "FERSYS Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/utils/downloadFeedback.ts src/components/DownloadFeedbackCenter.tsx src/pages/NewWorkOrderPage.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Android PDF downloads and large work order UX"
          git push
