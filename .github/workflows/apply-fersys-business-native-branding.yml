name: Apply FERSYS Business native branding

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  branding:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare master icon
        run: |
          rm -rf assets
          mkdir -p assets
          cp public/fersys-app-icon-1024.png assets/icon.png

      - name: Generate Android branding assets
        run: |
          npx @capacitor/assets@3.0.5 generate --android \
            --iconBackgroundColor "#10143D" \
            --iconBackgroundColorDark "#10143D" \
            --splashBackgroundColor "#10143D" \
            --splashBackgroundColorDark "#10143D"

      - name: Build web app
        run: npm run build

      - name: Commit generated Android branding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/AndroidManifest.xml android/app/src/main/res
          if git diff --cached --quiet; then
            echo "No generated Android branding changes to commit."
            exit 0
          fi
          git commit -m "Apply FERSYS Business Android branding [skip ci]"
          git push origin main
