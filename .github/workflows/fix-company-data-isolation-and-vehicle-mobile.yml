name: Fix company invoice isolation and vehicle mobile UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply urgent fixes
        shell: bash
        run: |
          cat > src/utils/scopedLocalStorage.ts <<'EOF'
          /**
           * Returns a per-account storage key so data cached in the browser/native
           * WebView can never be shown to a different signed-in FERSYS account.
           *
           * Supabase persists the active auth session under an sb-*-auth-token key.
           * We only read the user id from that local session object; if it cannot be
           * resolved we deliberately use an isolated fallback rather than the old
           * shared global key.
           */
          export function scopedStorageKey(base: string): string {
            try {
              for (let index = 0; index < localStorage.length; index += 1) {
                const key = localStorage.key(index)
                if (!key || !key.startsWith('sb-') || !key.endsWith('-auth-token')) {
                  continue
                }

                const raw = localStorage.getItem(key)
                if (!raw) continue

                const parsed = JSON.parse(raw) as {
                  user?: { id?: string }
                  currentSession?: { user?: { id?: string } }
                }

                const userId = parsed?.user?.id ?? parsed?.currentSession?.user?.id
                if (userId) {
                  return `${base}:${userId}`
                }
              }
            } catch {
              // Never fall back to the old unscoped key.
            }

            return `${base}:isolated`
          }
          EOF

          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:100]!r}')
              text = text.replace(old, new, count if count is not None else -1)
              p.write_text(text)

          # 1) Outgoing invoices: never rely only on RLS; explicitly scope every
          # read/update/delete to current_company_id as defense in depth.
          p = Path('src/services/invoices.service.ts')
          text = p.read_text()
          text = text.replace(
          "export async function getInvoices<\n  T extends InvoiceCloudShape,\n>(): Promise<T[]> {\n  const { data, error } =\n    await supabase",
          "export async function getInvoices<\n  T extends InvoiceCloudShape,\n>(): Promise<T[]> {\n  const companyId =\n    await getCurrentCompanyId()\n\n  const { data, error } =\n    await supabase"
          )
          text = text.replace(
          ".from('invoices')\n      .select('*')\n      .order(",
          ".from('invoices')\n      .select('*')\n      .eq('company_id', companyId)\n      .order(", 1
          )
          text = text.replace(
          "export async function updateInvoice<\n  T extends InvoiceCloudShape,\n>(\n  invoice: T,\n): Promise<T> {\n  const { data, error } =",
          "export async function updateInvoice<\n  T extends InvoiceCloudShape,\n>(\n  invoice: T,\n): Promise<T> {\n  const companyId =\n    await getCurrentCompanyId()\n\n  const { data, error } ="
          )
          text = text.replace(
          ".eq(\n        'id',\n        invoice.id,\n      )\n      .select('*')",
          ".eq(\n        'id',\n        invoice.id,\n      )\n      .eq('company_id', companyId)\n      .select('*')", 1
          )
          text = text.replace(
          "export async function deleteInvoice(\n  id: string,\n): Promise<void> {\n  const { error } =",
          "export async function deleteInvoice(\n  id: string,\n): Promise<void> {\n  const companyId =\n    await getCurrentCompanyId()\n\n  const { error } ="
          )
          text = text.replace(
          ".eq(\n        'id',\n        id,\n      )\n\n  if (error)",
          ".eq(\n        'id',\n        id,\n      )\n      .eq('company_id', companyId)\n\n  if (error)", 1
          )
          p.write_text(text)

          # 2) Outgoing invoices page: remove the dangerous automatic import of
          # whatever happens to be in the old global localStorage cache.
          p = Path('src/pages/InvoicesPage.tsx')
          text = p.read_text()
          text = text.replace(
          "  importLocalInvoices,\n",
          ""
          )
          text = text.replace(
          "import { downloadInvoicePdf } from '../utils/invoicePdf'\n",
          "import { downloadInvoicePdf } from '../utils/invoicePdf'\nimport { scopedStorageKey } from '../utils/scopedLocalStorage'\n"
          )
          text = text.replace(
          "const STORAGE_KEY =\n  'fersys_invoices'",
          "const STORAGE_KEY =\n  scopedStorageKey('fersys_invoices')"
          )
          dangerous = """        const local =\n          readInvoices()\n\n        await importLocalInvoices(\n          local,\n        )\n\n"""
          if dangerous not in text:
              raise SystemExit('Dangerous outgoing invoice auto-import block not found')
          text = text.replace(dangerous, '')
          p.write_text(text)

          # 3) New/edit invoice cache is also per signed-in account.
          p = Path('src/pages/NewInvoicePage.tsx')
          text = p.read_text()
          text = text.replace(
          "import { downloadInvoicePdf } from '../utils/invoicePdf'\n",
          "import { downloadInvoicePdf } from '../utils/invoicePdf'\nimport { scopedStorageKey } from '../utils/scopedLocalStorage'\n"
          )
          text = text.replace(
          "const STORAGE_KEY = 'fersys_invoices'",
          "const STORAGE_KEY = scopedStorageKey('fersys_invoices')"
          )
          p.write_text(text)

          # 4) Incoming invoices were using one global key for every account.
          # Isolate both list and editor immediately; do not migrate the polluted
          # legacy global cache into a new account-specific key.
          for path in ['src/pages/IncomingInvoicesPage.tsx', 'src/pages/NewIncomingInvoicePage.tsx']:
              p = Path(path)
              text = p.read_text()
              anchor = "import {\n  deleteDocument,\n  downloadDocument,\n} from '../utils/documentStorage'\n" if path.endswith('IncomingInvoicesPage.tsx') else "import {\n  deleteDocument,\n  downloadDocument,\n  saveDocument,\n} from '../utils/documentStorage'\n"
              if anchor not in text:
                  raise SystemExit(f'Incoming invoice import anchor not found in {path}')
              text = text.replace(anchor, anchor + "import { scopedStorageKey } from '../utils/scopedLocalStorage'\n")
              text = text.replace("const STORAGE_KEY =\n  'fersys_incoming_invoices'", "const STORAGE_KEY =\n  scopedStorageKey('fersys_incoming_invoices')")
              text = text.replace("const STORAGE_KEY = 'fersys_incoming_invoices'", "const STORAGE_KEY = scopedStorageKey('fersys_incoming_invoices')")
              p.write_text(text)

          # 5) Vehicles mobile page: stats must not push actual vehicles below
          # the fold. 2 compact cards per row on phone, all 4 in one row on lg+.
          p = Path('src/pages/VehiclesPage.tsx')
          text = p.read_text()
          text = text.replace(
          'className="grid gap-3 sm:grid-cols-2 xl:grid-cols-4"',
          'className="grid grid-cols-2 gap-2 lg:grid-cols-4"'
          )
          old_card = '''    <div className="rounded-2xl border border-slate-800 bg-slate-900 p-5">\n      <div className="flex items-center justify-between">\n        <span className="grid h-10 w-10 place-items-center rounded-xl bg-blue-500/10 text-blue-400">\n          <Icon size={19} />\n        </span>\n\n        <strong className="text-2xl font-black text-white">\n          {value}\n        </strong>\n      </div>\n\n      <p className="mt-4 text-xs font-bold uppercase tracking-wide text-slate-500">\n        {label}\n      </p>\n    </div>'''
          new_card = '''    <div className="rounded-xl border border-slate-800 bg-slate-900 px-3 py-2.5 sm:px-4 sm:py-3">\n      <div className="flex min-w-0 items-center gap-2.5">\n        <span className="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-blue-500/10 text-blue-400">\n          <Icon size={16} />\n        </span>\n\n        <div className="min-w-0 flex-1">\n          <p className="truncate text-[10px] font-bold uppercase tracking-wide text-slate-500 sm:text-xs">\n            {label}\n          </p>\n          <strong className="mt-0.5 block text-lg font-black leading-none text-white sm:text-xl">\n            {value}\n          </strong>\n        </div>\n      </div>\n    </div>'''
          if old_card not in text:
              raise SystemExit('Vehicle StatCard pattern not found')
          text = text.replace(old_card, new_card)
          p.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit generated fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/invoices.service.ts src/pages/InvoicesPage.tsx src/pages/NewInvoicePage.tsx src/pages/IncomingInvoicesPage.tsx src/pages/NewIncomingInvoicePage.tsx src/pages/VehiclesPage.tsx src/utils/scopedLocalStorage.ts
          git commit -m "Fix invoice account isolation and compact vehicle stats"
          git push
