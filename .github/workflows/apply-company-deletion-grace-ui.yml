name: Apply company deletion grace-period UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-company-deletion-grace-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch AdminCompanyDetailsPage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/admin/AdminCompanyDetailsPage.tsx')
          text = path.read_text()
          original = text

          text = text.replace('  ShieldBan,\n', '')
          text = text.replace('  Trash2,\n', '')
          text = text.replace('  deleteAdminCompany,\n', '')

          service_import = "} from './services/admin.service'\n"
          panel_import = "import { AdminCompanyDeletionPanel } from './AdminCompanyDeletionPanel'\n"
          if panel_import not in text:
              if service_import not in text:
                  raise SystemExit('services import anchor not found')
              text = text.replace(service_import, service_import + panel_import, 1)

          text, state_count = re.subn(
              r"\n  const \[deleteConfirmation, setDeleteConfirmation\] =\n    useState\(''\)\n\n  const \[deletingCompany, setDeletingCompany\] =\n    useState\(false\)\n",
              '\n',
              text,
              count=1,
          )
          if state_count != 1:
              raise SystemExit(f'deletion state block count={state_count}')

          text, handler_count = re.subn(
              r"\n  async function handleDeleteCompany\(\) \{.*?\n  \}\n\n  async function saveChanges\(\) \{",
              "\n  async function saveChanges() {",
              text,
              count=1,
              flags=re.S,
          )
          if handler_count != 1:
              raise SystemExit(f'delete handler count={handler_count}')

          text, panel_count = re.subn(
              r"\n          <article className=\"rounded-3xl border border-red-500/25 bg-red-500/5 p-6\">.*?\n          </article>",
              "\n          <AdminCompanyDeletionPanel\n            companyId={company.companyId}\n            companyName={company.companyName}\n          />",
              text,
              count=1,
              flags=re.S,
          )
          if panel_count != 1:
              raise SystemExit(f'danger-zone article count={panel_count}')

          if text == original:
              raise SystemExit('No changes made')

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit tested change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/admin/AdminCompanyDetailsPage.tsx
          git commit -m "Replace immediate company deletion with 15-day review flow"
          git push
