name: Pre-release cleanup

on:
  push:
    branches:
      - pre-release-field-service-upgrade
    paths:
      - '.github/workflows/pre-release-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pre-release-field-service-upgrade
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Restore normal workflow files and remove temporary release tooling
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/mobile-quality-parity-fix.yml .github/scripts/mobile_quality_parity_fix.py
          git rm -f .github/scripts/pre_release_stage2.py .github/scripts/pre_release_stage3.py
          git rm -f .github/workflows/pre-release-stage2.yml .github/workflows/pre-release-stage3.yml .github/workflows/pre-release-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github
          git commit -m "Clean temporary pre-release tooling [skip ci]"
          git push origin HEAD:pre-release-field-service-upgrade
