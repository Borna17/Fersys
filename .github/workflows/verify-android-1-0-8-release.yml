name: Verify FERSYS Android 1.0.8 release

on:
  push:
    branches: [main]
    paths:
      - 'android/app/build.gradle'
      - 'scripts/prepare-android-release.mjs'
      - 'scripts/android-release-check.mjs'
      - '.github/workflows/verify-android-1-0-8-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-android-release.mjs
