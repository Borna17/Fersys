name: Fix cloud unfinished drafts

on:
  push:
    branches: [fix-cloud-draft-manifest]
    paths:
      - '.github/scripts/fix_cloud_draft_manifest.py'
      - '.github/workflows/fix-cloud-draft-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply patch
        run: python .github/scripts/fix_cloud_draft_manifest.py

      - name: TypeScript and production build
        run: npm run build

      - name: Lint changed app files
        run: npx eslint src/services/drafts.service.ts src/components/UniversalDraftProtection.tsx

      - name: Verify cloud recovery
        run: |
          grep -q 'refreshDraftManifestFromCloud' src/services/drafts.service.ts
          grep -q "from('user_drafts')" src/services/drafts.service.ts
          grep -q "window.addEventListener('online', onOnline)" src/components/UniversalDraftProtection.tsx
          grep -q "window.addEventListener('focus', onFocus)" src/components/UniversalDraftProtection.tsx

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/drafts.service.ts src/components/UniversalDraftProtection.tsx
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m "Restore unfinished drafts from cloud [skip ci]"
          git push origin HEAD:fix-cloud-draft-manifest
