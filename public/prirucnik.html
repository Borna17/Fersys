<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <meta name="robots" content="noindex" />
    <title>FERSYS | Korisnički priručnik</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #020617; color: #fff; }
      body { min-height: 100vh; }
      .shell { min-height: 100vh; display: flex; flex-direction: column; }
      .bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 18px; border-bottom: 1px solid #1e293b; background: rgba(15,23,42,.97); position: sticky; top: 0; z-index: 10; }
      .brand { min-width: 0; }
      .eyebrow { margin: 0; color: #a78bfa; font-size: 11px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 4px 0 0; font-size: 18px; line-height: 1.2; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
      .btn { min-height: 42px; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; padding: 0 14px; text-decoration: none; font-size: 14px; font-weight: 800; }
      .back { color: #e2e8f0; background: #1e293b; }
      .download { color: #fff; background: linear-gradient(135deg,#2563eb,#7c3aed); }
      .viewer { flex: 1; min-height: 0; background: #0f172a; }
      iframe { display: block; width: 100%; height: calc(100vh - 71px); border: 0; background: #fff; }
      .mobile-note { display: none; padding: 18px; text-align: center; color: #94a3b8; font-size: 13px; line-height: 1.5; }
      @media (max-width: 640px) {
        .bar { align-items: flex-start; flex-direction: column; }
        .actions { width: 100%; }
        .actions .btn { flex: 1; }
        iframe { height: calc(100vh - 132px); }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="bar">
        <div class="brand">
          <p class="eyebrow">FERSYS PODRŠKA</p>
          <h1>Korisnički priručnik</h1>
        </div>
        <div class="actions">
          <a class="btn back" href="/support">Natrag na podršku</a>
          <a class="btn download" href="/FERSYS-Korisnicki-prirucnik.pdf" download="FERSYS-Korisnicki-prirucnik.pdf">Preuzmi PDF</a>
        </div>
      </header>

      <section class="viewer">
        <iframe
          src="/FERSYS-Korisnicki-prirucnik.pdf#view=FitH"
          title="FERSYS korisnički priručnik"
        ></iframe>
        <div class="mobile-note">
          Ako preglednik ne podržava ugrađeni PDF prikaz, koristi gumb „Preuzmi PDF“ iznad.
        </div>
      </section>
    </main>
  </body>
</html>
