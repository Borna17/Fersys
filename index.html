<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />

    <!-- FERSYS favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="/favicon-48x48.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="64x64"
      href="/favicon-64x64.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/favicon-192x192.png"
    />

    <link
      rel="shortcut icon"
      href="/favicon.ico"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
      name="theme-color"
      content="#020617"
    />

    <meta
      name="application-name"
      content="FERSYS"
    />

    <meta
      name="description"
      content="FERSYS poslovna aplikacija za radne naloge, ponude, račune, skladište, zaposlenike, kalendar i AI pomoćnika."
    />

    <meta
      name="apple-mobile-web-app-title"
      content="FERSYS"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="format-detection"
      content="telephone=no"
    />

    <!-- Google / društvene mreže -->
    <meta
      property="og:site_name"
      content="FERSYS"
    />

    <meta
      property="og:title"
      content="FERSYS"
    />

    <meta
      property="og:description"
      content="Radni nalozi, ponude, računi, skladište, zaposlenici, kalendar i AI pomoćnik na jednom mjestu."
    />

    <meta
      property="og:url"
      content="https://www.fersys.app/"
    />

    <!-- Google Site Name -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "FERSYS",
        "alternateName": "Fersys",
        "url": "https://www.fersys.app/"
      }
    </script>

    <title>FERSYS</title>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
