<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">FERSYS logo icon</title>
  <defs>
    <linearGradient id="blueGradient" x1="90" y1="70" x2="300" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="0.45" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="purpleGradient" x1="220" y1="80" x2="440" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C084FC"/>
      <stop offset="0.48" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="overlapGradient" x1="210" y1="150" x2="310" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0.90"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <rect x="72" y="146" width="236" height="236" rx="58"
          transform="rotate(-45 190 264)"
          fill="url(#blueGradient)"/>
    <rect x="204" y="146" width="236" height="236" rx="58"
          transform="rotate(-45 322 264)"
          fill="url(#purpleGradient)"/>
    <path d="M256 131.2 388.8 264 256 396.8 123.2 264 256 131.2Z"
          fill="url(#overlapGradient)"
          clip-path="url(#overlapClip)"
          opacity="0.68"/>
  </g>

  <defs>
    <clipPath id="overlapClip">
      <rect x="204" y="146" width="236" height="236" rx="58"
            transform="rotate(-45 322 264)"/>
    </clipPath>
  </defs>
</svg>
